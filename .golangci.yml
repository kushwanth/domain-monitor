version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - gocyclo
    - goconst
    - mnd
    - govet
    - gocritic
    - ineffassign
    - revive
    - forbidigo
    - unused
  settings:
    gocyclo:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - ifElseChain
    errcheck:
      check-type-assertions: true
      check-blank: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the project logging utilities
        - pattern: ^log\..*$
          msg: use the project logging utilities
        - pattern: ^slog\.(Debug|Info|Warn|Error).*$
          msg: use the project logging utilities
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - goconst
          - gosec
      - path: src/internal/monitor/utils\.go
        linters:
          - forbidigo

run:
  timeout: 5m
  tests: true
