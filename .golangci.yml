version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - gocyclo
    - govet
    - gocritic
    - ineffassign
    - unused
  settings:
    gocyclo:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - ifElseChain
    errcheck:
      check-type-assertions: true
      check-blank: false
  exclusions:
    rules:
      # These existing protocol evaluators require focused refactors and regression tests.
      # New production functions remain subject to the complexity limit above.
      - path: src/(dns|lookup)\.go
        linters:
          - gocyclo
        text: 'func `(validateDNSSEC|EvaluateEmailSecurity|extractWHOISTier|synthesizeTierData|EvaluateRDAP)`'
      - path: _test\.go
        linters:
          - gocyclo
          - gosec

run:
  timeout: 5m
  tests: true
