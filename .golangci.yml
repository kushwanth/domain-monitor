version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - gocyclo
    - govet
    - gocritic
    - ineffassign
    - revive
    - forbidigo
    - unused
  settings:
    gocyclo:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - ifElseChain
    errcheck:
      check-type-assertions: true
      check-blank: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the project logging utilities
        - pattern: ^log\..*$
          msg: use the project logging utilities
        - pattern: ^slog\.(Debug|Info|Warn|Error).*$
          msg: use the project logging utilities
  exclusions:
    rules:
      # These existing protocol evaluators require focused refactors and regression tests.
      # New production functions remain subject to the complexity limit above.
      - path: src/internal/monitor/(dns|lookup)\.go
        linters:
          - gocyclo
        text: 'func `(validateDNSSEC|validateRecordsWithReason|EvaluateEmailSecurity|extractWHOISTier|synthesizeTierData|EvaluateRDAP)`'
      - path: _test\.go
        linters:
          - gocyclo
          - gosec
      - path: src/internal/monitor/utils\.go
        linters:
          - forbidigo

run:
  timeout: 5m
  tests: true
