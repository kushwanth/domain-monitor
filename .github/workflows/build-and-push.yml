name: CI/CD
run-name: ${{ github.event.head_commit.message || github.ref_name }}
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Go quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l src)"
      - name: Test with race detection and coverage reporting
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Diff hygiene
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --check "$(git merge-base HEAD origin/main)" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  build-and-push:
    name: Build Container Image
    if: github.ref_type == 'tag'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git branch -r --contains ${{ github.sha }} | grep -E 'origin/main$'; then
            echo "Tag is not on the main branch. Aborting build."
            exit 1
          fi

      - name: Set lower case repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push independent binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
