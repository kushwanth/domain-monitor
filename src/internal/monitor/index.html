<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Monitor</title>
  <style>
    :root {
      /* Light Theme Variables */
      --bg-main: #fafafa;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --border: #eaeaea;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #eff6ff;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .text-success {
      color: var(--success);
    }

    .text-warning {
      color: var(--warning);
    }

    .text-error {
      color: var(--error);
    }

    .text-lowercase {
      text-transform: lowercase;
    }

    .text-uppercase {
      text-transform: uppercase;
    }

    .text-capitalize {
      text-transform: capitalize;
    }

    [data-theme="dark"] {
      /* OLED Dark Theme Variables */
      --bg-main: #0a0a0a;
      --bg-sidebar: #111111;
      --bg-card: #171717;
      --bg-hover: #262626;
      --border: #262626;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #1e3a8a;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      line-height: 1.6;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Sidebar */
    .sidebar {
      flex: 0 0 260px;
      min-width: 0;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      overflow-y: auto;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 12px;
    }

    .nav-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary-hover);
      color: var(--primary);
    }

    [data-theme="dark"] .nav-item.active {
      background-color: rgba(59, 130, 246, 0.1);
    }

    .theme-toggle {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .sidebar-meta {
      min-width: 0;
    }

    .renewal-pricing {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
      overflow-wrap: anywhere;
    }

    .pricing-item {
      display: grid;
      gap: 2px;
    }

    .pricing-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    .pricing-amount {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .last-updated {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* Main Content */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .header {
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .content {
      padding: 32px 48px;
      flex: 1;
      min-width: 0;
    }

    /* Domains View */
    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .domain-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .empty-state {
      padding: 40px 24px;
      text-align: center;
    }

    .empty-state-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state-copy {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9rem;
    }

    .domain-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .domain-group .domain-card {
      margin-bottom: 0;
    }

    .domain-group-heading {
      margin: 16px 0 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .domain-header {
      padding: 18px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20px;
      align-items: start;
      gap: 8px 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      list-style: none;
      /* Remove native detail marker */
    }

    .domain-header-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 20px;
      min-width: 0;
    }

    .domain-header-domains .domain-title {
      flex: 1 1 220px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .domain-expiry {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .domain-expiry.warning {
      color: var(--warning);
    }

    .domain-expiry.error {
      color: var(--error);
    }

    .domain-header-dns .domain-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .domain-header::-webkit-details-marker {
      display: none;
    }

    .domain-header:hover {
      background-color: var(--bg-hover);
    }

    .unused-card {
      grid-template-columns: minmax(0, 1fr);
      cursor: default;
    }

    .unused-card:hover {
      background-color: var(--bg-card);
    }

    .domain-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.ok {
      background-color: var(--success);
    }

    .status-dot.error {
      background-color: var(--error);
    }

    .domain-chevron {
      grid-column: 2;
      grid-row: 1;
      color: var(--text-muted);
      transition: transform 0.3s;
    }

    details[open] .domain-chevron {
      transform: rotate(180deg);
    }

    .domain-details {
      padding: 0 24px 24px 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 24px;
    }

    .detail-column {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .detail-panel {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0;
    }

    .detail-panel h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .detail-row {
      display: flex;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      flex: 0 0 140px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .detail-value {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 500;
    }

    .detail-value.emphasis {
      font-weight: 600;
    }

    .lookup-source {
      font-size: 0.85em;
      opacity: 0.8;
    }

    .data-list {
      margin: 0;
      padding-left: 0;
      list-style-type: none;
    }

    .hidden {
      display: none !important;
    }

    /* Stats Header */
    .header-stats {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }

    .header-search {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      min-width: 0;
    }

    .header-search .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .header-search input {
      padding: 9px 34px 9px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      width: 250px;
      font-size: 0.875rem;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      box-shadow: var(--shadow);
    }

    .header-search input:focus {
      border-color: var(--primary);
      width: 320px;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .header-search:focus-within .search-icon {
      color: var(--primary);
    }

    .header-search input::placeholder {
      color: var(--text-muted);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.15s ease;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
    }

    .stat-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
      min-width: 0;
      flex-wrap: wrap;
    }

    .stat-box:hover {
      background-color: var(--bg-hover);
    }

    .stat-box.active {
      background-color: var(--primary-hover);
      border-color: var(--primary);
    }

    .stat-box.alert-error:not(.active) {
      border-color: var(--error);
    }

    [data-theme="dark"] .stat-box.active {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      overflow-wrap: anywhere;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-bar {
      padding: 10px 48px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-main);
    }

    .pagination-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      font-size: 0.85rem;
    }

    .pagination-summary {
      color: var(--text-muted);
      margin-right: 8px;
    }

    .pagination-button {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
    }

    .pagination-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    @media (max-width: 1100px) {
      .header {
        flex-direction: column;
        align-items: stretch;
        padding: 16px 24px;
      }

      .header-search,
      .header-search input,
      .header-search input:focus {
        width: 100%;
      }

      .content {
        padding: 24px;
      }

      .controls-bar {
        padding: 10px 24px;
      }

      .domain-details {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      body {
        min-height: 100vh;
        height: auto;
        flex-direction: column;
        overflow: visible;
      }

      .sidebar {
        flex: none;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        overflow: visible;
      }

      .sidebar .brand {
        grid-column: 1 / -1;
        margin: 0;
        padding: 0;
        font-size: 1rem;
      }

      .nav-items {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-item {
        padding: 8px 10px;
        font-size: 0.875rem;
      }

      .theme-toggle {
        grid-column: 2;
        grid-row: 2;
        padding: 8px 10px;
        gap: 8px;
      }

      .sidebar-meta {
        grid-column: 1 / -1;
      }

      .renewal-pricing { margin-bottom: 16px; }
      .last-updated { margin-bottom: 12px; }

      .main {
        overflow: visible;
      }

      .header {
        padding: 16px;
        gap: 12px;
      }

      .controls-bar {
        padding: 10px 16px;
      }

      .content {
        padding: 16px;
      }

      .domain-header {
        padding: 16px;
      }

      .domain-details {
        padding: 16px;
      }

      .detail-label {
        flex-basis: 110px;
      }
    }

    @media (max-width: 480px) {
      .header-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: stretch;
      }

      .stat-box {
        align-content: center;
      }

      .pagination-summary {
        width: 100%;
        margin-right: 0;
        text-align: right;
      }

      .detail-row {
        flex-direction: column;
        gap: 2px;
      }

      .detail-label {
        flex-basis: auto;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      DomainMonitor
    </div>
    <div class="nav-items">
      <div class="nav-item active" onclick="switchView('domains')" id="nav-domains">Domains</div>
      <div class="nav-item" onclick="switchView('dns')" id="nav-dns">DNS Records</div>
    </div>
    <div class="sidebar-meta">
      <div id="renewal-pricing" class="renewal-pricing hidden">
        <div class="pricing-item">
          <span class="pricing-label">Minimum annual renewal cost</span>
          <strong class="pricing-amount">$<span id="total-renewal-cost">0.00</span>/yr</strong>
        </div>
        <div class="pricing-item">
          <span class="pricing-label">Renewals due in next 12 months</span>
          <strong class="pricing-amount">$<span id="next-year-renewal-cost">0.00</span></strong>
        </div>
      </div>
      <div id="last-updated" class="last-updated"></div>
    </div>
    <div class="theme-toggle" onclick="toggleTheme()">
      <span>Theme</span>
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div id="view-stats" class="header-stats">
        <!-- Rendered via JS -->
      </div>
      <div class="header-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search domains or records..."
          oninput="handleSearch(this.value)" autocomplete="off" spellcheck="false">
        <button id="searchClearBtn" class="search-clear-btn hidden" onclick="clearSearch()" title="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>
    <div id="controls-bar" class="controls-bar hidden">
      <div id="pagination-controls" class="pagination-controls"></div>
    </div>

    <div class="content">
      <!-- Domains View -->
      <div id="view-domains" class="domain-list">
        <!-- Rendered via JS -->
      </div>

      <!-- DNS View -->
      <div id="view-dns" class="domain-list hidden"></div>

    </div>
  </main>

  <script>
    let currentView = 'domains';
    let currentFilter = 'all';
    let pollInterval = null;
    let appState = {};
    let stateETag = '';
    let connectionError = false;
    let searchQuery = '';
    let currentPage = 1;
    const itemsPerPage = 50;

    let searchDebounceTimer = null;

    function handleSearch(query, immediate = false) {
      const rawQuery = (query || '').toLowerCase().trim();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !rawQuery);
      }
      if (searchDebounceTimer) {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = null;
      }
      const update = () => {
        searchQuery = rawQuery;
        currentPage = 1;
        refreshCurrentView();
      };
      if (immediate || !rawQuery) {
        update();
      } else {
        searchDebounceTimer = setTimeout(update, 200);
      }
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        handleSearch('', true);
        input.focus();
      }
    }

    function setPage(page) {
      currentPage = page;
      refreshCurrentView();
    }

    function refreshCurrentView() {
      if (currentView === 'domains') renderDomains();
      else if (currentView === 'dns') renderDNS();
    }

    function renderPagination(totalItems) {
      const container = document.getElementById('pagination-controls');
      if (!container) return;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      document.getElementById('controls-bar').classList.toggle('hidden', totalPages <= 1);
      if (totalPages <= 1) {
        container.innerHTML = '';
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      let html = `<span class="pagination-summary">Page ${currentPage} of ${totalPages} (${totalItems} items)</span>`;
      html += `<button class="pagination-button" onclick="setPage(${currentPage > 1 ? currentPage - 1 : 1})" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>`;
      html += `<button class="pagination-button" onclick="setPage(${currentPage < totalPages ? currentPage + 1 : totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;
      container.innerHTML = html;
    }

    // Theme initialization with localStorage persistence and query param support
    const urlParams = new URLSearchParams(window.location.search);
    const paramTheme = urlParams.get('theme');
    let savedTheme = '';
    try { savedTheme = localStorage.getItem('theme') || ''; } catch (e) { }
    if (paramTheme === 'dark' || paramTheme === 'light') {
      document.documentElement.setAttribute('data-theme', paramTheme);
    } else if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) { }
    }

    function switchView(view) {
      if (view !== 'domains' && view !== 'dns') view = 'domains';
      if (currentView !== view) {
        currentFilter = 'all'; // reset filter on view switch
        currentPage = 1;
        searchQuery = '';
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = null;
        }
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.value = '';
        }
        const clearBtn = document.getElementById('searchClearBtn');
        if (clearBtn) {
          clearBtn.classList.add('hidden');
        }
      }
      currentView = view;
      if (window.location.hash !== '#' + view && !window.location.hash.startsWith('#' + view + ':') && !window.location.hash.startsWith('#open:') && !window.location.hash.startsWith('#dns:')) {
        history.replaceState(null, '', '#' + view);
      }
      document.getElementById('nav-domains').classList.toggle('active', view === 'domains');
      document.getElementById('nav-dns').classList.toggle('active', view === 'dns');
      document.getElementById('view-domains').classList.toggle('hidden', view !== 'domains');
      document.getElementById('view-dns').classList.toggle('hidden', view !== 'dns');

      // Update stats on view switch without requiring a full fetch
      if (view === 'domains') {
        renderDomains();
      } else if (view === 'dns') {
        renderDNS();
      }
    }

    function toggleFilter(filter) {
      if (currentFilter === filter) {
        currentFilter = 'all';
      } else {
        currentFilter = filter;
      }
	  currentPage = 1;
      if (currentView === 'domains') {
        renderDomains();
      } else if (currentView === 'dns') {
        renderDNS();
      }
    }

    function renderStats(total, healthy, issues, unused) {
      const healthyLabel = currentView === 'dns' ? 'Matched' : 'Healthy';
      const issuesLabel = currentView === 'dns' ? 'Not Matched' : 'Issues';
      document.getElementById('view-stats').innerHTML = `
        <div class="stat-box ${currentFilter === 'all' ? 'active' : ''}" onclick="toggleFilter('all')">
          <span class="stat-label">Total</span>
          <span class="stat-value">${total}</span>
        </div>
        <div class="stat-box ${currentFilter === 'healthy' ? 'active' : ''}" onclick="toggleFilter('healthy')">
          <span class="stat-label">${healthyLabel}</span>
          <span class="stat-value"><span class="status-dot ok"></span>${healthy}</span>
        </div>
        <div class="stat-box ${currentFilter === 'issues' ? 'active' : ''} ${issues > 0 ? 'alert-error' : ''}" onclick="toggleFilter('issues')">
          <span class="stat-label">${issuesLabel}</span>
          <span class="stat-value"><span class="status-dot error"></span>${issues}</span>
        </div>
        ${currentView === 'domains' ? `
        <div class="stat-box ${currentFilter === 'unused' ? 'active' : ''}" onclick="toggleFilter('unused')">
          <span class="stat-label">Allowed Expiry</span>
          <span class="stat-value">${unused}</span>
        </div>` : ''}

      `;
    }

    function formatUserTzDate(isoString) {
      if (!isoString) return '';

      let dateStr = '';
      let tz = '';
      try {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {
        tz = '';
      }
      const tzSuffix = tz ? ` (${tz})` : '';

      try {
        if (window.Temporal && window.Temporal.Instant) {
          dateStr = Temporal.Instant.from(isoString).toLocaleString(navigator.language);
        } else {
          dateStr = new Date(isoString).toLocaleString();
        }
      } catch (e) {
        dateStr = new Date(isoString).toLocaleString();
      }
      return dateStr + tzSuffix;
    }

    function updateHeaderTimestamps() {
      const el = document.getElementById('last-updated');
      if (!el) return;
      if (connectionError) {
        el.textContent = appState.last_updated ? 'Connection lost — showing last received state' : 'Connection lost — waiting for state';
        return;
      }
      if (appState.last_updated) {
        const updatedDate = formatUserTzDate(appState.last_updated);
        let txt = `<div>Last Updated: ${escapeHTML(updatedDate)}</div>`;
        if (appState.next_refresh) {
          const nextDate = formatUserTzDate(appState.next_refresh);
          txt += `<div>Next Update: ${escapeHTML(nextDate)}</div>`;
        }
        if (appState.cycle?.outcome === 'failed') {
          txt += `<div>Last Attempt: Failed — showing last successful snapshot</div>`;
        } else if (appState.cycle?.overrun) {
          txt += `<div>Last Attempt: Completed after the configured interval</div>`;
        }
        el.innerHTML = txt;
      } else {
        el.innerText = 'Initializing... (Please wait)';
      }
    }

    function updateRenewalPricing() {
      if (!appState || !appState.rdap_checks) return;
      let annualTotal = 0;
      let annualUnknown = 0;
      let nextYearTotal = 0;
      let nextYearUnknown = 0;
      const now = Date.now();
      const nextYear = now + 365 * 24 * 60 * 60 * 1000;
      Object.values(appState.rdap_checks).forEach(c => {
        if (!c || c.allow_expiry || c.expiry_confirmed || c.is_delegated_zone || !c.status || c.status === 'pending') return;
        const hasPrice = Number.isFinite(c.renewal_price) && c.renewal_price > 0;
        if (hasPrice) annualTotal += c.renewal_price;
        else annualUnknown++;

        const expiresAt = Date.parse(c.expiration || '');
        if (Number.isFinite(expiresAt) && expiresAt >= now && expiresAt <= nextYear) {
          if (hasPrice) nextYearTotal += c.renewal_price;
          else nextYearUnknown++;
        }
      });
      const amountText = (total, unknown) => unknown > 0 ? `${total.toFixed(2)} (partial; ${unknown} unknown)` : total.toFixed(2);
      document.getElementById('total-renewal-cost').textContent = amountText(annualTotal, annualUnknown);
      document.getElementById('next-year-renewal-cost').textContent = amountText(nextYearTotal, nextYearUnknown);

      const container = document.getElementById('renewal-pricing');
      if (container) {
        container.classList.toggle('hidden', annualTotal <= 0 && annualUnknown <= 0);
      }
    }

    function normalizeCheckCollections(data) {
      if (!data) return data;
      for (const field of ['rdap_checks', 'dns_checks', 'email_checks', 'dnssec_checks', 'ns_health', 'caa_checks']) {
        if (Array.isArray(data[field])) {
          data[field] = Object.fromEntries(data[field].map(item => [item.id, item.result]));
        }
      }
      return data;
    }

    async function pollState() {
      try {
        const res = await fetch('/api/state', { headers: stateETag ? { 'If-None-Match': stateETag } : {} });
        if (res.status === 304) {
          connectionError = false;
          updateHeaderTimestamps();
          return;
        }
        if (!res.ok) throw new Error(`State request failed: ${res.status}`);
        const data = normalizeCheckCollections(await res.json());
        stateETag = res.headers?.get?.('ETag') || '';
        connectionError = false;
        if (data && data.status !== 'initializing' && (data.last_updated || data.cycle?.outcome)) {
          if (data.last_updated !== appState.last_updated || data.cycle?.id !== appState.cycle?.id) {
            appState = data;
            updateRenewalPricing();
            if (currentView === 'domains') {
              renderDomains();
            } else if (currentView === 'dns') {
              renderDNS();
            }
          }
        }
        updateHeaderTimestamps();
      } catch (err) {
        connectionError = true;
        updateHeaderTimestamps();
      } finally {
        pollInterval = setTimeout(pollState, appState.last_updated ? 15000 : 2500);
      }
    }

    function initialize() {
      updateHeaderTimestamps();
      pollState();

      const hash = window.location.hash.replace('#', '');
      if (['domains', 'dns'].includes(hash)) {
        switchView(hash);
      } else if (hash.startsWith('dns:')) {
        const target = decodeURIComponent(hash.substring(4)).toLowerCase();
        switchView('dns');
        setTimeout(() => {
          const card = document.querySelector(`details[data-search*="${CSS.escape(target)}"]`);
          if (card) card.open = true;
        }, 50);
      } else if (hash.startsWith('open:') || hash.startsWith('nshealth:')) {
        const target = hash.substring(hash.startsWith('open:') ? 5 : 9);
        switchView('domains');
        setTimeout(() => {
          const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
          if (card) card.open = true;
        }, 50);
      } else {
        switchView('domains');
      }

      window.addEventListener('hashchange', () => {
        const view = window.location.hash.replace('#', '');
        if (['domains', 'dns'].includes(view) && currentView !== view) {
          switchView(view);
        } else if (view.startsWith('dns:')) {
          const target = decodeURIComponent(view.substring(4)).toLowerCase();
          switchView('dns');
          setTimeout(() => {
            const card = document.querySelector(`details[data-search*="${CSS.escape(target)}"]`);
            if (card) card.open = true;
          }, 50);
        } else if (view.startsWith('open:') || view.startsWith('nshealth:')) {
          const target = view.substring(view.startsWith('open:') ? 5 : 9);
          switchView('domains');
          setTimeout(() => {
            const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
            if (card) card.open = true;
          }, 50);
        }
      });

    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g,
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    function formatTitleCase(str) {
      if (str === null || str === undefined || str === '') return 'None';
      str = String(str);
      return str.replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/[_-]/g, ' ')
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    function formatCAAValue(val) {
      if (!val) return 'None';
      const trimmed = String(val).trim();
      if (trimmed === ';' || trimmed === '""' || trimmed === "''") {
        return 'Deny All';
      }
      return escapeHTML(val);
    }

    function aggregateDomainStatus(states) {
      const statuses = states.map(state => state && (state.status || (state.valid === false ? 'failed' : undefined))).filter(Boolean);
      if (statuses.some(status => ['failed', 'mismatch', 'hijacked'].includes(status))) return 'error';
      if (statuses.some(status => status === 'warning')) return 'warning';
      if (statuses.length === 0 || statuses.some(status => status === 'pending')) return 'unknown';
      return 'ok';
    }

    function expiryCountdown(expiration) {
      const expiresAt = Date.parse(expiration || '');
      if (!Number.isFinite(expiresAt)) return { text: 'Expiry unknown', className: '' };
      const difference = expiresAt - Date.now();
      if (difference < 0) {
        return { text: `Expired ${Math.ceil(-difference / 86400000)}d ago`, className: 'error' };
      }
      const days = Math.ceil(difference / 86400000);
      return { text: `${days}d left`, className: days <= 30 ? 'warning' : '' };
    }

    function renderDomains() {
      const container = document.getElementById('view-domains');
      const previouslyOpen = new Set();
      container.querySelectorAll('details.domain-card[open]').forEach(el => {
        const id = el.getAttribute('data-search');
        if (id) previouslyOpen.add(id);
      });
      container.innerHTML = '';

      const rdapChecks = appState.rdap_checks || {};
      const emailChecks = appState.email_checks || {};
      const caaChecks = appState.caa_checks || {};
      const dnssecChecks = appState.dnssec_checks || {};
      const nsHealthChecks = appState.ns_health || appState.ns_health_checks || {};

      let allDomains = new Set(Object.keys(rdapChecks));
      if (allDomains.size === 0) {
        allDomains = new Set([
          ...Object.keys(emailChecks),
          ...Object.keys(caaChecks),
          ...Object.keys(dnssecChecks)
        ]);
      }

      if (allDomains.size === 0) {
        renderPagination(0);
        container.innerHTML = `
          <div class="domain-card empty-state">
            <div class="empty-state-title">Monitoring Initializing</div>
            <p class="empty-state-copy">Initial domain and security checks are running.<br>Results will appear here automatically.</p>
          </div>
        `;
        renderStats(0, 0, 0, 0);
        return;
      }

      let healthyCount = 0;
      let issueCount = 0;
      let unusedCount = 0;

      const domainDataList = [];
      const sortedDomains = Array.from(allDomains).sort((a, b) => a.localeCompare(b));

      for (const domain of sortedDomains) {
        const rdapState = rdapChecks[domain] || {};
        const emailState = emailChecks[domain] || {};
        const dnssecState = dnssecChecks[domain] || {};
        const caaState = caaChecks[domain] || {};
        const nsHealthState = nsHealthChecks[domain] || {};

        const checkStates = [rdapState, emailState, dnssecState, caaState, nsHealthState];
        const statusClass = aggregateDomainStatus(checkStates);
        if (!rdapState.expiry_confirmed && (!rdapState.status || checkStates.some(state => state && state.status === 'pending') || statusClass === 'unknown')) {
          continue;
        }
        const group = (rdapState.allow_expiry || rdapState.expiry_confirmed) ? 'unused' : (statusClass === 'error' || statusClass === 'warning' ? 'issues' : 'healthy');

        if (group === 'unused') unusedCount++;
        else if (group === 'issues') issueCount++;
        else healthyCount++;

        domainDataList.push({
          domain,
          rdapState,
          emailState,
          dnssecState,
          caaState,
          nsHealthState,
          group
        });
      }

      let filteredDomains = domainDataList;
      if (searchQuery) {
        filteredDomains = filteredDomains.filter(item => item.domain.toLowerCase().includes(searchQuery));
      }
      if (currentFilter !== 'all') {
        filteredDomains = filteredDomains.filter(item => item.group === currentFilter);
      }

      const groupOrder = { healthy: 0, issues: 1, unused: 2 };
      filteredDomains.sort((a, b) => groupOrder[a.group] - groupOrder[b.group] || a.domain.localeCompare(b.domain));

      const totalFiltered = filteredDomains.length;
      renderPagination(totalFiltered);

      if (totalFiltered === 0) {
        container.innerHTML = `
          <div class="domain-card empty-state">
            <div class="empty-state-title">${domainDataList.length === 0 ? 'Checks in Progress' : 'No Domains Found'}</div>
            <p class="empty-state-copy">${domainDataList.length === 0 ? 'Domains will appear when their checks finish.' : 'No domains match the current search or filter criteria.'}</p>
          </div>
        `;
        renderStats(healthyCount + issueCount + unusedCount, healthyCount, issueCount, unusedCount);
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedDomains = filteredDomains.slice(startIndex, startIndex + itemsPerPage);
      const groupedCards = { healthy: [], issues: [], unused: [] };

      for (const item of paginatedDomains) {
        const domain = item.domain;
        const rdapState = item.rdapState;
        const emailState = item.emailState;
        const dnssecState = item.dnssecState;
        const caaState = item.caaState;
        const nsHealthState = item.nsHealthState;

        if (item.group === 'unused' && rdapState.expiry_confirmed) {
          const card = document.createElement('div');
          card.className = 'domain-card domain-header domain-header-domains unused-card';
          card.setAttribute('data-search', domain.toLowerCase());
          card.innerHTML = `<div class="domain-title text-lowercase">${escapeHTML(domain)}</div>`;
          groupedCards.unused.push(card);
          continue;
        }

        let emailHtml = `<div class="detail-panel"><h3>Email</h3><p class="detail-value text-muted">Not Configured</p></div>`;
        if (emailState.status) {
          const mxs = (emailState.mx && emailState.mx.length > 0) ? `<ul class="data-list"><li>${emailState.mx.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const mailRouteHtml = emailState.provider
            ? `<div class="detail-row"><div class="detail-label">Provider:</div><div class="detail-value">${escapeHTML(formatTitleCase(emailState.provider))}</div></div>`
            : `<div class="detail-row"><div class="detail-label">MX Records:</div><div class="detail-value text-lowercase">${mxs}</div></div>`;
          const isDkimValid = (emailState.dkim_valid && emailState.dkim_valid.length > 0);
          let dkimDisplay = 'Not Configured';
          if (isDkimValid) {
            dkimDisplay = `<span class="text-success">Valid (${escapeHTML(emailState.dkim_valid.join(', '))})</span>`;
          } else if (emailState.dkim_expected) {
            dkimDisplay = '<span class="text-warning">Missing</span>';
          }

          let emailStatusClass = 'text-success';
          if (emailState.status === 'failed' || emailState.status === 'hijacked') {
            emailStatusClass = 'text-error';
          } else if (emailState.status === 'warning' || emailState.status === 'mismatch') {
            emailStatusClass = 'text-warning';
          }

          emailHtml = `
            <div class="detail-panel">
              <h3>Email Security</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value ${emailStatusClass}">${formatTitleCase(emailState.status)}</div></div>
              <div class="detail-row"><div class="detail-label">SPF:</div><div class="detail-value">${emailState.spf ? 'Configured' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DMARC:</div><div class="detail-value">${emailState.dmarc ? 'Configured' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DKIM:</div><div class="detail-value">${dkimDisplay}</div></div>
              ${mailRouteHtml}
              ${emailState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value text-error">${escapeHTML(emailState.error)}</div></div>` : ''}
            </div>`;
        }

        const renewalPrice = rdapState.is_delegated_zone ? 'Not applicable'
          : Number.isFinite(rdapState.renewal_price) && rdapState.renewal_price > 0
            ? `$${rdapState.renewal_price.toFixed(2)}/yr` : 'Unknown';

        let rdapHtml = `
        <div class="detail-panel">
          <h3>Domain Information</h3>
          <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value text-muted">Not Configured</div></div>
          <div class="detail-row"><div class="detail-label">Renewal Price:</div><div class="detail-value">${renewalPrice}</div></div>
        </div>`;

        const expText = rdapState.expiration ? new Date(rdapState.expiration).toLocaleString() : 'Unknown';
        if (rdapState.status) {
          const ns = (rdapState.nameservers && rdapState.nameservers.length > 0) ? `<ul class="data-list"><li>${rdapState.nameservers.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const statuses = (rdapState.domain_status && rdapState.domain_status.length > 0) ? `<ul class="data-list"><li>${rdapState.domain_status.map(formatTitleCase).map(escapeHTML).join('</li><li>')}</li></ul>` : 'Active';

          if (rdapState.is_delegated_zone) {
            rdapHtml = `
              <div class="detail-panel">
                <h3>Delegated Zone</h3>
                <div class="detail-row"><div class="detail-label">Renewal Price:</div><div class="detail-value">${renewalPrice}</div></div>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value text-lowercase">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value">Monitored</div></div>
              </div>`;
          } else {
            let regDisplay = escapeHTML(rdapState.registrar) || 'None reported';
            if (rdapState.registrar_iana_id) {
              regDisplay += ` (IANA ${escapeHTML(rdapState.registrar_iana_id)})`;
            }
            if (rdapState.registrar_mismatch) {
              regDisplay += ` <span class="text-error">Mismatch (Expected: ${escapeHTML(rdapState.expected_registrar)})</span>`;
            }

            rdapHtml = `
              <div class="detail-panel">
                <h3>Domain Information</h3>
                <div class="detail-row"><div class="detail-label">Registrar:</div><div class="detail-value">${regDisplay}</div></div>
                <div class="detail-row"><div class="detail-label">Renewal Price:</div><div class="detail-value">${renewalPrice}</div></div>
                <div class="detail-row"><div class="detail-label">Expiration:</div><div class="detail-value">${expText}</div></div>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value text-lowercase">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value text-capitalize">${statuses}</div></div>
                <div class="detail-row"><div class="detail-label">DNSSEC:</div><div class="detail-value">${rdapState.dnssec ? 'Enabled' : 'Disabled'}</div></div>

                ${rdapState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value text-error">${escapeHTML(rdapState.error)}</div></div>` : ''}
              </div>`;
          }
        }

        let dnssecHtml = `<div class="detail-panel"><h3>DNSSEC</h3><p class="detail-value text-muted">Not Configured</p></div>`;
        if (dnssecState.source) {
          dnssecHtml = `
            <div class="detail-panel">
              <h3>DNSSEC Validation</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value ${dnssecState.valid ? 'text-success' : 'text-error'}">${dnssecState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 1 (Local):</div><div class="detail-value">${dnssecState.ds_matches_dnskey && dnssecState.rrsig_valid ? 'Pass' : 'Fail'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 2 (DoH):</div><div class="detail-value">${dnssecState.chain_intact ? 'Pass' : (dnssecState.source === 'local_only' ? 'N/A' : 'Fail')}</div></div>
              ${!dnssecState.valid && dnssecState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value text-error">${escapeHTML(dnssecState.error)}</div></div>` : ''}
            </div>
          `;
        }

        let caaHtml = `<div class="detail-panel"><h3>CAA Records</h3><p class="detail-value text-muted">Not Configured</p></div>`;
        if (caaState.issue || caaState.issuewild || caaState.issuemail || caaState.error) {
          caaHtml = `
            <div class="detail-panel">
              <h3>CAA Records</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value ${caaState.valid ? 'text-success' : 'text-error'}">${caaState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Issue:</div><div class="detail-value">${(caaState.issue || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueWild:</div><div class="detail-value">${(caaState.issuewild || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueMail:</div><div class="detail-value">${(caaState.issuemail || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              ${caaState.unknown_cas && caaState.unknown_cas.length > 0 ? `<div class="detail-row"><div class="detail-label">Unknown CAs:</div><div class="detail-value text-warning">${caaState.unknown_cas.map(formatCAAValue).join(', ')}</div></div>` : ''}
            </div>
          `;
        }

        let nsHealthHtml = '';
        if (nsHealthState && nsHealthState.servers) {
          const isNSPending = !nsHealthState.servers || nsHealthState.servers.length === 0;
          const statusText = isNSPending ? 'Pending' : (nsHealthState.valid ? 'In Sync' : 'Issues Detected');
          const statusClass = isNSPending ? 'text-warning' : (nsHealthState.valid ? 'text-success' : 'text-error');
          const serverCount = nsHealthState.servers ? nsHealthState.servers.length : 0;
          const hiddenServerCount = nsHealthState.servers ? nsHealthState.servers.filter(server => server.hidden).length : 0;
          const answeringServerCount = serverCount - hiddenServerCount;
          nsHealthHtml = `
            <div class="detail-panel">
              <h3>Nameserver Health</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value emphasis ${statusClass}">${statusText}</div></div>
              <div class="detail-row"><div class="detail-label">Configured NS checked:</div><div class="detail-value">${isNSPending ? 'Query Pending' : serverCount}</div></div>
              ${isNSPending ? '' : `<div class="detail-row"><div class="detail-label">Answering / Hidden:</div><div class="detail-value">${answeringServerCount} / ${hiddenServerCount}</div></div>`}
              ${rdapState.source ? `<div class="detail-row"><div class="detail-label">Lookup Source:</div><div class="detail-value text-uppercase lookup-source">${escapeHTML(rdapState.source)}</div></div>` : ''}
            </div>
          `;
        }

        const card = document.createElement('details');
        card.className = item.group === 'unused' ? 'domain-card unused-card' : 'domain-card';
        card.setAttribute('data-search', domain.toLowerCase());
        if (window.location.hash === '#open:' + domain.toLowerCase() || previouslyOpen.has(domain.toLowerCase())) {
          card.open = true;
        }

        const chevronHtml = `<svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        const expiry = rdapState.is_delegated_zone ? null : expiryCountdown(rdapState.expiration);

        card.innerHTML = `
          <summary class="domain-header domain-header-domains">
            <div class="domain-header-left">
              <div class="domain-title text-lowercase">${escapeHTML(domain)}</div>
              ${expiry ? `<span class="domain-expiry ${expiry.className}">${expiry.text}</span>` : ''}
            </div>
            ${chevronHtml}
          </summary>
          <div class="domain-details">
            <div class="detail-column">
              ${rdapHtml}
              ${caaHtml}
            </div>
            <div class="detail-column">
              ${emailHtml}
              ${dnssecHtml}
              ${nsHealthHtml}
            </div>
          </div>
        `;
        groupedCards[item.group].push(card);
      } // end of for loop

      for (const [group, heading] of [['healthy', 'Healthy Domains'], ['issues', 'Domains with Issues'], ['unused', 'Allowed to Expire']]) {
        if (groupedCards[group].length === 0) continue;
        const section = document.createElement('section');
        section.className = 'domain-group';
        const title = document.createElement('h2');
        title.className = 'domain-group-heading';
        title.textContent = heading;
        section.appendChild(title);
        groupedCards[group].forEach(card => section.appendChild(card));
        container.appendChild(section);
      }

      if (currentView === 'domains') {
        renderStats(healthyCount + issueCount + unusedCount, healthyCount, issueCount, unusedCount);
      }
    }



    function renderDNS() {
      const container = document.getElementById('view-dns');
      const previouslyOpen = new Set();
      container.querySelectorAll('details.domain-card[open]').forEach(el => {
        const id = el.getAttribute('data-search-id');
        if (id) previouslyOpen.add(id);
      });
      container.innerHTML = '';

      const dnsChecks = appState.dns_checks || {};
      const dnsKeys = Object.keys(dnsChecks).sort((a, b) => a.localeCompare(b));

      if (dnsKeys.length === 0) {
        renderPagination(0);
        container.innerHTML = `
          <div class="domain-card empty-state">
            <div class="empty-state-title">DNS Checks Initializing</div>
            <p class="empty-state-copy">DNS record verification is running.<br>Records will appear here automatically.</p>
          </div>
        `;
        renderStats(0, 0, 0, 0);
        return;
      }

      let healthyCount = 0;
      let issueCount = 0;

      const dnsDataList = [];
      for (const key of dnsKeys) {
        const state = dnsChecks[key] || {};
        const matched = state.status === 'ok' || state.status === 'ok_flattened';
        const notMatched = ['failed', 'api_error', 'mismatch', 'warning'].includes(state.status);
        if (!matched && !notMatched) continue;
        const group = matched ? 'matched' : 'unmatched';
        if (matched) healthyCount++;
        else issueCount++;

        let statusClass = 'ok';
        let statusText = 'Healthy';

        const name = escapeHTML(state.name || state.hostname || 'Unknown');
        const hostname = escapeHTML(state.hostname || 'Unknown');
        const type = escapeHTML((state.type || 'Unknown').toUpperCase());
        const expectedUl = (state.expected && state.expected.length > 0) ? `<ul class="data-list"><li>${state.expected.map(escapeHTML).join('</li><li>')}</li></ul>` : 'N/A';
        const found = (state.found && state.found.length > 0) ? `<ul class="data-list"><li>${state.found.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';

        if (state.status === 'failed' || state.status === 'api_error') {
          statusClass = 'error';
          statusText = 'Issue Detected';
        } else if (state.status === 'mismatch' || state.status === 'warning') {
          statusClass = 'warning';
          statusText = 'Not Matched';
        } else {
          statusClass = 'ok';
          statusText = 'Healthy';
        }

        dnsDataList.push({
          key,
          state,
          name,
          hostname,
          type,
          expectedUl,
          found,
          statusClass,
          statusText,
          group
        });
      }

      let filteredDNS = dnsDataList;
      if (searchQuery) {
        filteredDNS = filteredDNS.filter(item =>
          item.key.toLowerCase().includes(searchQuery) ||
          (item.state.hostname && item.state.hostname.toLowerCase().includes(searchQuery)) ||
          (item.state.name && item.state.name.toLowerCase().includes(searchQuery))
        );
      }
      if (currentFilter === 'healthy') {
        filteredDNS = filteredDNS.filter(item => item.group === 'matched');
      } else if (currentFilter === 'issues') {
        filteredDNS = filteredDNS.filter(item => item.group === 'unmatched');
      }

      filteredDNS.sort((a, b) => (a.group === b.group ? a.key.localeCompare(b.key) : a.group === 'matched' ? -1 : 1));

      const totalFiltered = filteredDNS.length;
      renderPagination(totalFiltered);

      if (totalFiltered === 0) {
        container.innerHTML = `
          <div class="domain-card empty-state">
            <div class="empty-state-title">${dnsDataList.length === 0 ? 'Checks in Progress' : 'No DNS Records Found'}</div>
            <p class="empty-state-copy">${dnsDataList.length === 0 ? 'DNS records will appear when their checks finish.' : 'No DNS records match the current search or filter criteria.'}</p>
          </div>
        `;
        renderStats(healthyCount + issueCount, healthyCount, issueCount, 0);
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedDNS = filteredDNS.slice(startIndex, startIndex + itemsPerPage);
      const groupedCards = { matched: [], unmatched: [] };

      for (const item of paginatedDNS) {
        const key = item.key;
        const state = item.state;
        const name = item.name;
        const hostname = item.hostname;
        const type = item.type;
        const expectedUl = item.expectedUl;
        const found = item.found;
        const statusClass = item.statusClass;
        const statusText = item.statusText;

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search-id', key.toLowerCase());
        card.setAttribute('data-search', `${key.toLowerCase()} ${hostname.toLowerCase()} ${type.toLowerCase()} ${(state.name || '').toLowerCase()}`);
        const decHash = decodeURIComponent(window.location.hash).toLowerCase();
        if (decHash === '#open:' + key.toLowerCase() || decHash === '#dns:' + key.toLowerCase() || decHash === '#dns:' + hostname.toLowerCase() || previouslyOpen.has(key.toLowerCase())) {
          card.open = true;
        }

        card.innerHTML = `
          <summary class="domain-header domain-header-dns">
            <div class="domain-header-left">
              <div class="domain-title">
                <span class="text-lowercase">${name.toUpperCase()}</span>
              </div>
            </div>
            <svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="domain-details">
            <div class="detail-panel">
              <h3>Configuration</h3>
              <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${name}</div></div>
              <div class="detail-row"><div class="detail-label">Hostname:</div><div class="detail-value text-lowercase">${hostname}</div></div>
              <div class="detail-row"><div class="detail-label">Type:</div><div class="detail-value">${type}</div></div>
              <div class="detail-row"><div class="detail-label">Expected:</div><div class="detail-value text-lowercase">${expectedUl}</div></div>
            </div>
            <div class="detail-panel">
              <h3>Live Status</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value ${statusClass === 'error' ? 'text-error' : statusClass === 'warning' ? 'text-warning' : statusClass === 'ok' ? 'text-success' : 'text-muted'}">${statusText}</div></div>
              <div class="detail-row"><div class="detail-label">Found:</div><div class="detail-value text-lowercase">${found}</div></div>
              ${state.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value text-error">${escapeHTML(state.error)}</div></div>` : ''}
            </div>
          </div>
        `;
        groupedCards[item.group].push(card);
      }

      for (const [group, heading] of [['matched', 'Matched DNS Records'], ['unmatched', 'DNS Records Not Matched']]) {
        if (groupedCards[group].length === 0) continue;
        const section = document.createElement('section');
        section.className = 'domain-group';
        const title = document.createElement('h2');
        title.className = 'domain-group-heading';
        title.textContent = heading;
        section.appendChild(title);
        groupedCards[group].forEach(card => section.appendChild(card));
        container.appendChild(section);
      }

      if (currentView === 'dns') {
        renderStats(healthyCount + issueCount, healthyCount, issueCount, 0);
      }
    }

    initialize();
  </script>
</body>

</html>
