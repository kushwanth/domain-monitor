        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted);">
              <th style="padding: 12px 8px;">Issue Date</th>
              <th style="padding: 12px 8px;">Expiry Date</th>
              <th style="padding: 12px 8px;">Days Left</th>
              <th style="padding: 12px 8px;">Issuer</th>
              <th style="padding: 12px 8px;">Match</th>
              <th style="padding: 12px 8px;">Status</th>
            </tr>
          </thead>
          <tbody>
      `;

      pageCerts.forEach(c => {
        const notAfterDate = c.not_after ? new Date(c.not_after) : null;
        const notBeforeDate = c.not_before ? new Date(c.not_before) : null;
        const notAfterValid = notAfterDate && !isNaN(notAfterDate.getTime());
        const notBeforeValid = notBeforeDate && !isNaN(notBeforeDate.getTime());

        const daysLeft = notAfterValid ? Math.ceil((notAfterDate - new Date()) / (1000 * 60 * 60 * 24)) : null;
        const isExpired = daysLeft !== null && daysLeft < 0;
        let status = '<span class="badge warning">Unknown</span>';
        if (daysLeft !== null) {
          status = isExpired ? '<span class="badge error">Expired</span>' : '<span class="badge success">Active</span>';
        }

        let daysHtml = '-';
        if (daysLeft !== null) {
          if (daysLeft < 0) {
            daysHtml = `<span style="color: var(--error); font-weight: 600;">${Math.abs(daysLeft)}d ago</span>`;
          } else if (daysLeft <= 30) {
            daysHtml = `<span style="color: var(--warning); font-weight: 600;">${daysLeft}d left</span>`;
          } else {
            daysHtml = `${daysLeft}d left`;
          }
        }

        html += `
          <tr style="border-bottom: 1px solid var(--border);">
            <td style="padding: 12px 8px;">${notBeforeValid ? notBeforeDate.toLocaleDateString() : '-'}</td>
            <td style="padding: 12px 8px;">${notAfterValid ? notAfterDate.toLocaleDateString() : '-'}</td>
            <td style="padding: 12px 8px;">${daysHtml}</td>
            <td style="padding: 12px 8px;">${escapeHTML(c.issuer || 'Unknown')}</td>
            <td style="padding: 12px 8px; word-break: break-all;">${escapeHTML(c.match || '')}</td>
            <td style="padding: 12px 8px;">${status}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';

      if (totalPages > 1) {
        html += `
          <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px;">
            <span style="color: var(--text-muted); font-size: 0.85rem; margin-right: 8px;">Page ${certCurrentPage} of ${totalPages} (${totalItems} certs)</span>
            <button onclick="renderCertPage(${certCurrentPage > 1 ? certCurrentPage - 1 : 1})" ${certCurrentPage === 1 ? 'disabled' : ''} style="padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: ${certCurrentPage === 1 ? 'not-allowed' : 'pointer'}; opacity: ${certCurrentPage === 1 ? '0.5' : '1'};">Prev</button>
            <button onclick="renderCertPage(${certCurrentPage < totalPages ? certCurrentPage + 1 : totalPages})" ${certCurrentPage === totalPages ? 'disabled' : ''} style="padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: ${certCurrentPage === totalPages ? 'not-allowed' : 'pointer'}; opacity: ${certCurrentPage === totalPages ? '0.5' : '1'};">Next</button>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderCertsInit() {
      const rdapChecks = appState.rdap_checks || appState.rdap || {};
      let allDomains = Object.keys(rdapChecks);
      if (allDomains.length === 0) {
        allDomains = Array.from(new Set([
          ...Object.keys(appState.email_checks || appState.email || {}),
          ...Object.keys(appState.caa_checks || appState.caa || {}),
          ...Object.keys(appState.dnssec_checks || appState.dnssec || {}),
          ...Object.keys(appState.ns_health || appState.ns_health_checks || {})
        ]));
      }
      allDomains.sort((a, b) => a.localeCompare(b));

      let optionsHtml = '<option value="" style="background-color: var(--bg-card); color: var(--text-main);">Select a domain...</option>';
      allDomains.forEach(d => {
        const escapedD = escapeHTML(d);
        optionsHtml += `<option value="${escapedD}" style="background-color: var(--bg-card); color: var(--text-main);">${escapedD}</option>`;
      });

      document.getElementById('view-stats').innerHTML = `
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
          <div class="stat-box active" style="position: relative; padding: 0; border-radius: 6px;">
            <select id="cert-domain-select" onchange="fetchCerts()" style="appearance: none; -webkit-appearance: none; -moz-appearance: none; background: transparent; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; font-family: inherit; color: var(--text-main); cursor: pointer; outline: none; margin: 0; min-width: 240px; padding: 10px 44px 10px 16px; width: 100%;">
               ${optionsHtml}
            </select>
            <svg style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-main);" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div id="selected-domain-display" style="font-weight: 600; font-size: 1.05rem; color: var(--text-main);"></div>
        </div>
      `;

      let targetDomain = '';
      const hash = window.location.hash.replace('#', '');
      if (hash.startsWith('certs:')) {
        const hDomain = hash.substring(6);
        if (allDomains.includes(hDomain)) {
          targetDomain = hDomain;
        }
      }
      if (!targetDomain && allDomains.length > 0) {
        targetDomain = allDomains[0];
      }

      if (targetDomain) {
        setTimeout(() => {
          const sel = document.getElementById('cert-domain-select');
          if (sel) {
            sel.value = targetDomain;
            fetchCerts();
          }
        }, 0);
      }
    }

    async function fetchCerts() {
      const select = document.getElementById('cert-domain-select');
      if (!select) return;
      const domain = select.value;
      const container = document.getElementById('certs-table-container');
      const display = document.getElementById('selected-domain-display');
      if (!domain) {
        container.innerHTML = '<div style="color: var(--text-muted); padding: 24px 0; text-align: center;">Select a domain to view certificate history.</div>';
        if (display) display.textContent = '';
        return;
      }

      if (display) display.textContent = domain;

      container.innerHTML = '<div style="padding: 24px 0; text-align: center; color: var(--text-muted);">Loading certificate history...</div>';
      try {
        const res = await fetch('/api/certs?domain=' + encodeURIComponent(domain));
        let certs = await res.json();

        if (!certs || certs.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); padding: 24px 0; text-align: center;">No certificates found for this domain yet.</div>';
          return;
        }

        if (searchQuery) {
          certs = certs.filter(c =>
            (c.issuer && c.issuer.toLowerCase().includes(searchQuery)) ||
            (c.match && c.match.toLowerCase().includes(searchQuery))
          );
          if (certs.length === 0) {
            container.innerHTML = '<div style="color: var(--text-muted); padding: 24px 0; text-align: center;">No certificates matching "' + escapeHTML(searchQuery) + '" found.</div>';
            return;
          }
        }

        cachedCerts = certs;
        renderCertPage(1);
      } catch (err) {
        container.innerHTML = '<span style="color: var(--error)">Failed to load certificates.</span>';
      }
    }

    initialize();
  </script>
</body>

</html>
