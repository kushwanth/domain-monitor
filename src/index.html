<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light Theme Variables */
      --bg-main: #fafafa;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --border: #eaeaea;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #eff6ff;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.success { background-color: rgba(16, 185, 129, 0.1); color: var(--success); }
    .badge.warning { background-color: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .badge.error { background-color: rgba(239, 68, 68, 0.1); color: var(--error); }

    [data-theme="dark"] {
      /* OLED Dark Theme Variables */
      --bg-main: #0a0a0a;
      --bg-sidebar: #111111;
      --bg-card: #171717;
      --bg-hover: #262626;
      --border: #262626;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #1e3a8a;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      line-height: 1.6;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 12px;
    }

    .nav-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary-hover);
      color: var(--primary);
    }

    [data-theme="dark"] .nav-item.active {
      background-color: rgba(59, 130, 246, 0.1);
    }

    .theme-toggle {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .header {
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .content {
      padding: 32px 48px;
      flex: 1;
    }

    /* Domains View */
    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .domain-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .domain-header {
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 250px 120px 1fr auto;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
      list-style: none;
      /* Remove native detail marker */
    }

    .domain-expiry {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .domain-header::-webkit-details-marker {
      display: none;
    }

    .domain-header:hover {
      background-color: var(--bg-hover);
    }

    .domain-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-right: 16px;
    }

    .domain-status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      min-width: max-content;
    }
    
    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.ok {
      background-color: var(--success);
    }

    .status-dot.error {
      background-color: var(--error);
    }

    .status-dot.warning {
      background-color: var(--warning);
    }

    .status-dot.unknown {
      background-color: var(--text-muted);
    }

    .status-label {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .domain-chevron {
      color: var(--text-muted);
      transition: transform 0.3s;
    }

    details[open] .domain-chevron {
      transform: rotate(180deg);
    }

    .domain-details {
      padding: 0 24px 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 24px;
    }

    .detail-panel {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0;
    }

    .detail-panel h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .detail-row {
      display: flex;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      width: 140px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .detail-value {
      flex: 1;
      word-break: break-all;
      font-weight: 500;
    }

    .data-list {
      margin: 0;
      padding-left: 0;
      list-style-type: none;
    }

    .hidden {
      display: none !important;
    }

    /* Stats Header */
    .header-stats {
      display: flex;
      gap: 16px;
      padding: 32px 48px;
      border-bottom: 1px solid var(--border);
    }

    .stat-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
    }

    .stat-box:hover {
      background-color: var(--bg-hover);
    }

    .stat-box.active {
      background-color: var(--primary-hover);
      border-color: var(--primary);
    }

    [data-theme="dark"] .stat-box.active {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
        padding: 16px 8px;
      }

      .sidebar .brand,
      .sidebar .nav-item span,
      .sidebar .theme-toggle span {
        display: none;
      }

      .main {
        margin-left: 0;
      }

      .domain-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      DomainGuard
    </div>
    <div class="nav-items">
      <div class="nav-item active" onclick="switchView('domains')" id="nav-domains">Domains</div>
      <div class="nav-item" onclick="switchView('dns')" id="nav-dns">DNS Records</div>
      <div class="nav-item" onclick="switchView('certs')" id="nav-certs">Certificates</div>
    </div>
    <div id="last-updated"
      style="margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted); text-align: center;"></div>
    <div class="theme-toggle" onclick="toggleTheme()">
      <span>Theme</span>
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </div>
  </aside>

  <main class="main">
    <div id="view-stats" class="header-stats">
      <!-- Rendered via JS -->
    </div>

    <div class="content">
      <!-- Domains View -->
      <div id="view-domains" class="domain-list">
        <!-- Rendered via JS -->
      </div>

      <!-- DNS View -->
      <div id="view-dns" class="domain-list hidden"></div>

      <!-- Certs View -->
      <div id="view-certs" class="domain-list hidden">
        <div class="domain-card" style="padding: 24px;">
           <div id="certs-table-container">Select a domain to view certificate history.</div>
        </div>
      </div>
    </div>
  </main>

  <script type="application/json" id="app-state">
    {{ .StateJSON }}
  </script>
  <script>
    let appState = JSON.parse(document.getElementById('app-state').textContent || '{}');
    let currentView = 'domains';
    let currentFilter = 'all';

    // Theme initialization
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function switchView(view) {
      if (currentView !== view) {
        currentFilter = 'all'; // reset filter on view switch
      }
      currentView = view;
      document.getElementById('nav-domains').classList.toggle('active', view === 'domains');
      document.getElementById('nav-dns').classList.toggle('active', view === 'dns');
      document.getElementById('nav-certs').classList.toggle('active', view === 'certs');

      document.getElementById('view-domains').classList.toggle('hidden', view !== 'domains');
      document.getElementById('view-dns').classList.toggle('hidden', view !== 'dns');
      document.getElementById('view-certs').classList.toggle('hidden', view !== 'certs');

      // Update stats on view switch without requiring a full fetch
      if (view === 'domains') {
        renderDomains();
      } else if (view === 'dns') {
        renderDNS();
      } else if (view === 'certs') {
        renderCertsInit();
      }
    }

    function toggleFilter(filter) {
      if (currentFilter === filter) {
        currentFilter = 'all';
      } else {
        currentFilter = filter;
      }
      if (currentView === 'domains') {
        renderDomains();
      } else {
        renderDNS();
      }
    }

    function renderStats(total, healthy, issues, expiringDomains, expiringCerts) {
      document.getElementById('view-stats').innerHTML = `
        <div class="stat-box ${currentFilter === 'all' ? 'active' : ''}" onclick="toggleFilter('all')">
          <span class="stat-label">Total</span>
          <span class="stat-value">${total}</span>
        </div>
        <div class="stat-box ${currentFilter === 'healthy' ? 'active' : ''}" onclick="toggleFilter('healthy')">
          <span class="stat-label">Healthy</span>
          <span class="stat-value"><span class="status-dot ok"></span>${healthy}</span>
        </div>
        <div class="stat-box ${currentFilter === 'issues' ? 'active' : ''}" style="${issues > 0 && currentFilter !== 'issues' ? 'border-color: var(--error);' : ''}" onclick="toggleFilter('issues')">
          <span class="stat-label">Issues</span>
          <span class="stat-value"><span class="status-dot error"></span>${issues}</span>
        </div>
        ${currentView === 'domains' ? `
        <div class="stat-box ${currentFilter === 'expiring' ? 'active' : ''}" style="${expiringDomains > 0 && currentFilter !== 'expiring' ? 'border-color: var(--warning);' : ''}" onclick="toggleFilter('expiring')">
          <span class="stat-label">Expiring/Expired Domains</span>
          <span class="stat-value" style="${expiringDomains > 0 ? 'color: var(--warning);' : ''}">${expiringDomains}</span>
        </div>` : ''}
        ${currentView === 'dns' ? `
        <div class="stat-box ${currentFilter === 'expiring' ? 'active' : ''}" style="${expiringCerts > 0 && currentFilter !== 'expiring' ? 'border-color: var(--warning);' : ''}" onclick="toggleFilter('expiring')">
          <span class="stat-label">Expiring SSL</span>
          <span class="stat-value" style="${expiringCerts > 0 ? 'color: var(--warning);' : ''}">${expiringCerts}</span>
        </div>` : ''}
      `;
    }

    function formatUserTzDate(isoString) {
      if (!isoString) return '';
      
      let dateStr = '';
      let tz = '';
      try {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {
        tz = '';
      }
      const tzSuffix = tz ? ` (${tz})` : '';
      
      try {
        if (window.Temporal && window.Temporal.Instant) {
          dateStr = Temporal.Instant.from(isoString).toLocaleString(navigator.language);
        } else {
          dateStr = new Date(isoString).toLocaleString();
        }
      } catch (e) {
        dateStr = new Date(isoString).toLocaleString();
      }
      return dateStr + tzSuffix;
    }

    function initialize() {
        if (appState.last_updated) {
          const updatedDate = formatUserTzDate(appState.last_updated);
          let txt = `Last Updated: ${updatedDate}`;
          if (appState.next_refresh) {
              const nextDate = formatUserTzDate(appState.next_refresh);
              txt += `<br>Next Update: ${nextDate}`;
          }
          document.getElementById('last-updated').innerHTML = txt;
        } else {
          document.getElementById('last-updated').innerText = 'Initializing... (Please wait)';
        }
        renderDomains();
        renderDNS();
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    function formatTitleCase(str) {
      if (!str) return 'None';
      return str.replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/[_-]/g, ' ')
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    function renderDomains() {
      const container = document.getElementById('view-domains');
      container.innerHTML = '';

      const rdapChecks = appState.rdap_checks || {};
      const emailChecks = appState.email_checks || {};
      const allDomains = new Set([...Object.keys(rdapChecks), ...Object.keys(emailChecks)]);

      let healthyCount = 0;
      let issueCount = 0;
      let expiringCount = 0;

      for (const domain of allDomains) {
        const rdapState = rdapChecks[domain] || {};
        const emailState = emailChecks[domain] || {};
        const dnssecState = (appState.dnssec_checks || {})[domain] || {};
        const caaState = (appState.caa_checks || {})[domain] || {};

        let statusClass = 'ok';
        let statusText = 'Healthy';
        let isExpiring = false;

        if (rdapState.status && rdapState.status !== "pending") {
          if (rdapState.expiration) {
            const expDate = new Date(rdapState.expiration);
            const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
            if (daysLeft <= 30) {
               isExpiring = true;
            }
          }
        }

        let badges = [];

        // RED (Critical Errors)
        if (rdapState.status === 'failed') badges.push({label: 'rdap_lookup_failed', cls: 'error'});
        if (rdapState.domain_status) {
           if (rdapState.domain_status.some(s => s.toLowerCase().includes('clienthold'))) badges.push({label: 'epp_client_hold', cls: 'error'});
           if (rdapState.domain_status.some(s => s.toLowerCase().includes('serverhold'))) badges.push({label: 'epp_server_hold', cls: 'error'});
           if (rdapState.domain_status.some(s => s.toLowerCase().includes('pendingdelete'))) badges.push({label: 'epp_pending_delete', cls: 'error'});
           if (rdapState.domain_status.some(s => s.toLowerCase().includes('redemptionperiod'))) badges.push({label: 'epp_redemption_period', cls: 'error'});
        }
        if (!rdapState.is_delegated_zone && (!rdapState.nameservers || rdapState.nameservers.length === 0)) badges.push({label: 'missing_nameservers', cls: 'error'});
        
        if (isExpiring) badges.push({label: 'expiring_domain', cls: 'error'});
        
        if (dnssecState.source && dnssecState.valid === false) {
           if (!dnssecState.ds_matches_dnskey) badges.push({label: 'dnssec_ds_mismatch', cls: 'error'});
           if (!dnssecState.rrsig_valid) badges.push({label: 'dnssec_rrsig_invalid', cls: 'error'});
           if (!dnssecState.chain_intact && dnssecState.source !== 'local_only') badges.push({label: 'dnssec_chain_broken', cls: 'error'});
           if (dnssecState.ds_matches_dnskey && dnssecState.rrsig_valid && dnssecState.chain_intact) badges.push({label: 'bad_dnssec', cls: 'error'}); // Fallback
        }
        
        if (emailState.status === 'failed') badges.push({label: 'email_lookup_failed', cls: 'error'});
        if (emailState.status === 'hijacked') badges.push({label: 'mx_hijacked', cls: 'error'});
        
        // YELLOW (Warnings)
        if (emailState.status === 'mismatch') badges.push({label: 'mx_mismatch', cls: 'warning'});
        if (emailState.status && emailState.status !== 'failed') {
           if (!emailState.spf) badges.push({label: 'missing_spf', cls: 'warning'});
           if (!emailState.dmarc) badges.push({label: 'missing_dmarc', cls: 'warning'});
           if (!emailState.dkim_valid || emailState.dkim_valid.length === 0) badges.push({label: 'missing_dkim', cls: 'warning'});
        }

        if (caaState.error) badges.push({label: 'caa_lookup_error', cls: 'warning'});
        if (caaState.valid === false) badges.push({label: 'caa_invalid', cls: 'warning'});
        if (caaState.unknown_cas && caaState.unknown_cas.length > 0) badges.push({label: 'caa_unauthorized_ca', cls: 'warning'});

        if (badges.length > 0) {
          if (badges.some(b => b.cls === 'error')) {
             statusClass = 'error';
          } else {
             statusClass = 'warning';
          }
        } else if (rdapState.status === 'pending') {
          statusClass = 'unknown';
        }

        let labelsHtml = '';
        if (badges.length > 0) {
            labelsHtml = badges.map(b => `<span class="badge ${b.cls}">${b.label}</span>`).join('');
        } else if (statusClass === 'unknown') {
            labelsHtml = `<span class="badge" style="color: var(--text-muted); background: var(--border);">unknown</span>`;
        } else {
            labelsHtml = `<span class="badge success">healthy</span>`;
        }

        if (statusClass === 'error' || statusClass === 'warning') {
          issueCount++;
        } else if (statusClass === 'ok') {
          healthyCount++;
        }
        if (isExpiring) {
          expiringCount++;
        }

        // Apply filters
        if (currentFilter === 'healthy' && statusClass !== 'ok') continue;
        if (currentFilter === 'issues' && statusClass !== 'error' && statusClass !== 'warning') continue;
        if (currentFilter === 'expiring' && !isExpiring) continue;

        let emailHtml = `<div class="detail-panel"><h3>Email</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (emailState.status) {
          const mxs = (emailState.mx && emailState.mx.length > 0) ? `<ul class="data-list"><li>${emailState.mx.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const isDkimValid = (emailState.dkim_valid && emailState.dkim_valid.length > 0);
          emailHtml = `
            <div class="detail-panel">
              <h3>Email Security</h3>
              <div class="detail-row"><div class="detail-label">Provider:</div><div class="detail-value" style="text-transform: capitalize;">${escapeHTML(formatTitleCase(emailState.provider)) || 'Custom/Basic'}</div></div>
              <div class="detail-row"><div class="detail-label">SPF:</div><div class="detail-value">${emailState.spf ? 'Valid' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DMARC:</div><div class="detail-value">${emailState.dmarc ? 'Valid' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DKIM:</div><div class="detail-value">${isDkimValid ? 'Valid' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">MX Records:</div><div class="detail-value" style="text-transform: lowercase;">${mxs}</div></div>
            </div>`;
        }

        let rdapHtml = `
        <div class="detail-panel">
          <h3>Domain Information</h3>
          <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: var(--text-muted)">Not Configured</div></div>
        </div>`;

        let badgeHtml = '';
        let expText = 'Unknown';
        if (rdapState.status && rdapState.status !== "pending") {
          expText = rdapState.expiration ? new Date(rdapState.expiration).toLocaleString() : 'Unknown';
          
          if (rdapState.expiration) {
            const expDate = new Date(rdapState.expiration);
            const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
            if (daysLeft < 0) {
               badgeHtml = `<span class="badge error">Expired</span>`;
               expiringCount++;
            } else if (daysLeft <= 30) {
               badgeHtml = `<span class="badge warning">${daysLeft}d left</span>`;
               expiringCount++;
            } else {
               badgeHtml = `<span class="badge success">${daysLeft}d left</span>`;
            }
          }
          
          const ns = (rdapState.nameservers && rdapState.nameservers.length > 0) ? `<ul class="data-list"><li>${rdapState.nameservers.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const statuses = (rdapState.domain_status && rdapState.domain_status.length > 0) ? `<ul class="data-list"><li>${rdapState.domain_status.map(formatTitleCase).map(escapeHTML).join('</li><li>')}</li></ul>` : 'Active';
          
          if (rdapState.is_delegated_zone) {
            rdapHtml = `
              <div class="detail-panel">
                <h3>Delegated Zone</h3>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value" style="text-transform: lowercase;">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value">Monitored</div></div>
              </div>`;
          } else {
            rdapHtml = `
              <div class="detail-panel">
                <h3>Domain Information</h3>
                <div class="detail-row"><div class="detail-label">Registrar:</div><div class="detail-value">${escapeHTML(rdapState.registrar) || 'Unknown'}</div></div>
                <div class="detail-row"><div class="detail-label">Expiration:</div><div class="detail-value">${expText}</div></div>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value" style="text-transform: lowercase;">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="text-transform: capitalize;">${statuses}</div></div>
                <div class="detail-row"><div class="detail-label">DNSSEC:</div><div class="detail-value">${rdapState.dnssec ? 'Enabled' : 'Disabled'}</div></div>
              </div>`;
          }
        }

        let dnssecHtml = `<div class="detail-panel"><h3>DNSSEC</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (dnssecState.source) {
          dnssecHtml = `
            <div class="detail-panel">
              <h3>DNSSEC Validation</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="${dnssecState.valid ? 'color: var(--success)' : 'color: var(--error)'}">${dnssecState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 1 (Local):</div><div class="detail-value">${dnssecState.ds_matches_dnskey && dnssecState.rrsig_valid ? 'Pass' : 'Fail'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 2 (DoH):</div><div class="detail-value">${dnssecState.chain_intact ? 'Pass' : (dnssecState.source === 'local_only' ? 'N/A' : 'Fail')}</div></div>
              <div class="detail-row"><div class="detail-label">Algorithms:</div><div class="detail-value">${(dnssecState.algorithms || []).join(', ') || 'None'}</div></div>
              ${dnssecState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error)">${escapeHTML(dnssecState.error)}</div></div>` : ''}
            </div>
          `;
        }

        let caaHtml = `<div class="detail-panel"><h3>CAA Records</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (caaState.issue || caaState.issuewild || caaState.issuemail || caaState.error) {
          caaHtml = `
            <div class="detail-panel">
              <h3>CAA Records</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="${caaState.valid ? 'color: var(--success)' : 'color: var(--error)'}">${caaState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Issue:</div><div class="detail-value">${(caaState.issue || []).map(escapeHTML).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueWild:</div><div class="detail-value">${(caaState.issuewild || []).map(escapeHTML).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueMail:</div><div class="detail-value">${(caaState.issuemail || []).map(escapeHTML).join(', ') || 'None'}</div></div>
              ${caaState.unknown_cas && caaState.unknown_cas.length > 0 ? `<div class="detail-row"><div class="detail-label">Unknown CAs:</div><div class="detail-value" style="color: var(--warning)">${caaState.unknown_cas.map(escapeHTML).join(', ')}</div></div>` : ''}
            </div>
          `;
        }

        const isRDAPFailed = (rdapState.status === 'failed');

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search', escapeHTML(domain.toLowerCase()));
        
        let chevronHtml = `<svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        
        if (isRDAPFailed) {
          card.onclick = (e) => e.preventDefault();
          chevronHtml = '';
        }
        
        card.innerHTML = `
          <summary class="domain-header">
            <div class="domain-title" style="text-transform: lowercase;">${escapeHTML(domain)}</div>
            <div class="domain-expiry">
              ${badgeHtml ? badgeHtml : `<span style="opacity: 0.6;">${expText}</span>`}
            </div>
            <div class="domain-status">
              <span class="status-label">
                ${labelsHtml}
              </span>
            </div>
            ${chevronHtml}
          </summary>
          <div class="domain-details">
            ${rdapHtml}
            ${emailHtml}
            ${dnssecHtml}
            ${caaHtml}
          </div>
        `;
        container.appendChild(card);
      } // end of for loop
      
      if (currentView === 'domains') {
        renderStats(allDomains.size, healthyCount, issueCount, expiringCount, 0);
      }
    }


    function renderDNS() {
      const container = document.getElementById('view-dns');
      container.innerHTML = '';

      const dnsChecks = appState.dns_checks || {};
      let healthyCount = 0;
      let issueCount = 0;
      let expiringCertCount = 0;

      for (const [key, state] of Object.entries(dnsChecks)) {
        if (state.status === 'failed' || state.status === 'api_error' || state.status === 'mismatch') {
          issueCount++;
        } else if (state.status === 'ok' || state.status === 'ok_flattened') {
          healthyCount++;
        }
      }

      for (const [key, state] of Object.entries(dnsChecks)) {

        let statusClass = 'ok';
        let statusText = 'Healthy';

        let badges = [];
        if (state.status === 'failed' || state.status === 'api_error') {
          badges.push({label: 'dns_failed', cls: 'error'});
        } else if (state.status === 'mismatch') {
          badges.push({label: 'dns_mismatch', cls: 'warning'});
        }

        const name = escapeHTML(formatTitleCase(state.name || state.hostname || 'Unknown'));
        const hostname = escapeHTML(state.hostname || 'Unknown');
        const type = escapeHTML((state.type || 'Unknown').toUpperCase());
        const expectedUl = state.expected ? `<ul class="data-list"><li>${state.expected.map(escapeHTML).join('</li><li>')}</li></ul>` : 'N/A';
        const foundInline = state.found ? state.found.map(escapeHTML).join(', ') : 'None';
        const found = state.found ? `<ul class="data-list"><li>${state.found.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';

        let isExpiringCert = false;
        let sslRow = '';
        let badgeHtml = '';
        if (state.ssl_days !== undefined && state.ssl_days !== -2) {
          if (state.ssl_days === -1) {
             sslRow = `<div class="detail-row"><div class="detail-label">SSL:</div><div class="detail-value" style="color: var(--warning);">No Cert / Error</div></div>`;
             badgeHtml = `<span class="badge error">No Cert</span>`;
             badges.push({label: 'ssl_missing', cls: 'error'});
          } else {
             sslRow = `<div class="detail-row"><div class="detail-label">SSL:</div><div class="detail-value">${state.ssl_days > 0 ? 'Valid (' + state.ssl_days + ' days)' : '<span style="color: var(--error);">Expired</span>'}</div></div>`;
             
             if (state.ssl_days < 0) {
               badgeHtml = `<span class="badge error">Expired</span>`;
               isExpiringCert = true;
               expiringCertCount++;
               badges.push({label: 'ssl_expired', cls: 'error'});
             } else if (state.ssl_days <= 30) {
               badgeHtml = `<span class="badge warning">${state.ssl_days}d left</span>`;
               isExpiringCert = true;
               expiringCertCount++;
               badges.push({label: 'ssl_expiring', cls: 'warning'});
             } else {
               badgeHtml = `<span class="badge success">${state.ssl_days}d left</span>`;
             }
          }
        }

        if (badges.length > 0) {
           if (badges.some(b => b.cls === 'error')) {
               statusClass = 'error';
           } else {
               statusClass = 'warning';
           }
        } else {
           statusClass = 'ok';
        }

        let labelsHtml = '';
        if (badges.length > 0) {
            labelsHtml = badges.map(b => `<span class="badge ${b.cls}">${b.label}</span>`).join('');
        } else {
            labelsHtml = `<span class="badge success">healthy</span>`;
        }

        // Apply filters
        if (currentFilter === 'healthy' && statusClass !== 'ok') continue;
        if (currentFilter === 'issues' && statusClass !== 'error' && statusClass !== 'warning') continue;
        if (currentFilter === 'expiring' && !isExpiringCert) continue;

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search', escapeHTML(key.toLowerCase()));
        card.innerHTML = `
          <summary class="domain-header">
            <div class="domain-title" style="text-transform: lowercase;">${hostname}</div>
            <div class="domain-expiry">
              ${badgeHtml}
            </div>
            <div class="domain-status">
              <span class="status-label">
                ${labelsHtml}
              </span>
            </div>
            <svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="domain-details">
            <div class="detail-panel">
              <h3>Configuration</h3>
              <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${name}</div></div>
              <div class="detail-row"><div class="detail-label">Hostname:</div><div class="detail-value" style="text-transform: lowercase;">${hostname}</div></div>
              <div class="detail-row"><div class="detail-label">Type:</div><div class="detail-value">${type}</div></div>
              <div class="detail-row"><div class="detail-label">Expected:</div><div class="detail-value" style="text-transform: lowercase;">${expectedUl}</div></div>
            </div>
            <div class="detail-panel">
              <h3>Live Status</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value">${statusText}</div></div>
              ${sslRow}
              <div class="detail-row"><div class="detail-label">Found:</div><div class="detail-value" style="text-transform: lowercase;">${found}</div></div>
              ${state.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error);">${escapeHTML(state.error)}</div></div>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      }

      if (currentView === 'dns') {
        renderStats(Object.keys(dnsChecks).length, healthyCount, issueCount, 0, expiringCertCount);
      }
    }
    function renderCertsInit() {
      const rdapChecks = appState.rdap_checks || {};
      const emailChecks = appState.email_checks || {};
      const allDomains = Array.from(new Set([...Object.keys(rdapChecks), ...Object.keys(emailChecks)])).sort();
      
      let optionsHtml = '<option value="" style="background-color: var(--bg-card); color: var(--text-main);">Select a domain...</option>';
      allDomains.forEach(d => {
          optionsHtml += `<option value="${d}" style="background-color: var(--bg-card); color: var(--text-main);">${d}</option>`;
      });

      document.getElementById('view-stats').innerHTML = `
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
          <div class="stat-box active" style="position: relative; padding: 0; border-radius: 6px;">
            <select id="cert-domain-select" onchange="fetchCerts()" style="appearance: none; -webkit-appearance: none; -moz-appearance: none; background: transparent; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; font-family: inherit; color: var(--text-main); cursor: pointer; outline: none; margin: 0; min-width: 260px; padding: 12px 48px 12px 20px; width: 100%;">
               ${optionsHtml}
            </select>
            <svg style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-main);" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div id="selected-domain-display" style="font-weight: 600; font-size: 1.1rem; color: var(--text-main);"></div>
        </div>
      `;
    }

    async function fetchCerts() {
       const domain = document.getElementById('cert-domain-select').value;
       const container = document.getElementById('certs-table-container');
       const display = document.getElementById('selected-domain-display');
       if (!domain) {
           container.innerHTML = 'Select a domain to view certificate history.';
           if (display) display.textContent = '';
           return;
       }
       
       if (display) display.textContent = domain;
       
       container.innerHTML = 'Loading history...';
       try {
           const res = await fetch('/api/certs?domain=' + encodeURIComponent(domain));
           const certs = await res.json();
           
           if (!certs || certs.length === 0) {
               container.innerHTML = 'No certificates found for this domain yet.';
               return;
           }
           
           let html = `
             <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
               <thead>
                 <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted);">
                   <th style="padding: 12px 8px;">Issue Date</th>
                   <th style="padding: 12px 8px;">Expiry Date</th>
                   <th style="padding: 12px 8px;">Days Left</th>
                   <th style="padding: 12px 8px;">Issuer</th>
                   <th style="padding: 12px 8px;">Match</th>
                   <th style="padding: 12px 8px;">Status</th>
                 </tr>
               </thead>
               <tbody>
           `;
           
           certs.forEach(c => {
               const notAfter = new Date(c.not_after);
               const daysLeft = Math.ceil((notAfter - new Date()) / (1000 * 60 * 60 * 24));
               const isExpired = daysLeft < 0;
               const status = isExpired ? '<span class="badge error">Expired</span>' : '<span class="badge success">Active</span>';
               
               let daysHtml = daysLeft < 0 ? '0' : daysLeft.toString();
               if (daysLeft <= 30 && daysLeft >= 0) {
                 daysHtml = `<span style="color: var(--warning); font-weight: 600;">${daysHtml}</span>`;
               }
               
               html += `
                 <tr style="border-bottom: 1px solid var(--border);">
                   <td style="padding: 12px 8px;">${new Date(c.not_before).toLocaleDateString()}</td>
                   <td style="padding: 12px 8px;">${notAfter.toLocaleDateString()}</td>
                   <td style="padding: 12px 8px;">${daysHtml}</td>
                   <td style="padding: 12px 8px;">${escapeHTML(c.issuer || 'Unknown')}</td>
                   <td style="padding: 12px 8px; word-break: break-all;">${escapeHTML(c.match || '')}</td>
                   <td style="padding: 12px 8px;">${status}</td>
                 </tr>
               `;
           });
           
           html += '</tbody></table>';
           container.innerHTML = html;
       } catch (err) {
           container.innerHTML = '<span style="color: var(--error)">Failed to load certificates.</span>';
       }
    }

    initialize();
  </script>
</body>

</html>
