<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Monitor</title>
  <style>
    :root {
      /* Light Theme Variables */
      --bg-main: #fafafa;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --border: #eaeaea;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #eff6ff;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.success {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .badge.warning {
      background-color: rgba(245, 158, 11, 0.1);
      color: var(--warning);
    }

    .badge.error {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--error);
    }

    [data-theme="dark"] {
      /* OLED Dark Theme Variables */
      --bg-main: #0a0a0a;
      --bg-sidebar: #111111;
      --bg-card: #171717;
      --bg-hover: #262626;
      --border: #262626;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #1e3a8a;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      line-height: 1.6;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 12px;
    }

    .nav-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary-hover);
      color: var(--primary);
    }

    [data-theme="dark"] .nav-item.active {
      background-color: rgba(59, 130, 246, 0.1);
    }

    .theme-toggle {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .header {
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .content {
      padding: 32px 48px;
      flex: 1;
    }

    /* Domains View */
    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .domain-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .domain-header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
      list-style: none;
      /* Remove native detail marker */
    }

    .domain-header-left {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
      flex: 1;
    }

    .domain-header-domains .domain-title {
      width: 280px;
      min-width: 200px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .domain-header-domains .domain-expiry {
      width: 120px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .domain-header-dns .domain-title {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .domain-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .domain-expiry {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .domain-header::-webkit-details-marker {
      display: none;
    }

    .domain-header:hover {
      background-color: var(--bg-hover);
    }

    .domain-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .domain-status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      min-width: max-content;
    }

    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.ok {
      background-color: var(--success);
    }

    .status-dot.error {
      background-color: var(--error);
    }

    .status-dot.warning {
      background-color: var(--warning);
    }

    .status-dot.unknown {
      background-color: var(--text-muted);
    }

    .status-label {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .domain-chevron {
      color: var(--text-muted);
      transition: transform 0.3s;
    }

    details[open] .domain-chevron {
      transform: rotate(180deg);
    }

    .domain-details {
      padding: 0 24px 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 24px;
    }

    .detail-panel {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0;
    }

    .detail-panel h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .detail-row {
      display: flex;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      width: 140px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .detail-value {
      flex: 1;
      word-break: break-all;
      font-weight: 500;
    }

    .data-list {
      margin: 0;
      padding-left: 0;
      list-style-type: none;
    }

    .hidden {
      display: none !important;
    }

    /* Stats Header */
    .header-stats {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }

    .header-search {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .header-search .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .header-search input {
      padding: 9px 34px 9px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      width: 250px;
      font-size: 0.875rem;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      box-shadow: var(--shadow);
    }

    .header-search input:focus {
      border-color: var(--primary);
      width: 320px;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .header-search:focus-within .search-icon {
      color: var(--primary);
    }

    .header-search input::placeholder {
      color: var(--text-muted);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.15s ease;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
    }

    .stat-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
    }

    .stat-box:hover {
      background-color: var(--bg-hover);
    }

    .stat-box.active {
      background-color: var(--primary-hover);
      border-color: var(--primary);
    }

    [data-theme="dark"] .stat-box.active {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
        padding: 16px 8px;
      }

      .sidebar .brand,
      .sidebar .nav-item span,
      .sidebar .theme-toggle span {
        display: none;
      }

      .main {
        margin-left: 0;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        padding: 16px 20px;
        gap: 12px;
      }

      .header-search input,
      .header-search input:focus {
        width: 100%;
      }

      .domain-header-domains .domain-title {
        width: auto;
        max-width: 100%;
      }

      .domain-header-left {
        flex-wrap: wrap;
        gap: 8px;
      }

      .domain-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      DomainMonitor
    </div>
    <div class="nav-items">
      <div class="nav-item active" onclick="switchView('domains')" id="nav-domains">Domains</div>
      <div class="nav-item" onclick="switchView('dns')" id="nav-dns">DNS Records</div>
      <div class="nav-item" onclick="switchView('certs')" id="nav-certs">Certificates</div>
      <div class="nav-item" onclick="switchView('nshealth')" id="nav-nshealth" style="display: none;">Nameservers</div>
    </div>
    <div id="renewal-pricing" style="display: none; margin-bottom: 12px; font-size: 0.85rem; font-weight: 600; text-align: center; color: var(--text-main);">
      Min. Renewal Cost: $<span id="total-renewal-cost">0.00</span>/yr
    </div>
    <div id="last-updated"
      style="margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted); text-align: center;"></div>
    <div class="theme-toggle" onclick="toggleTheme()">
      <span>Theme</span>
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div id="view-stats" class="header-stats">
        <!-- Rendered via JS -->
      </div>
      <div class="header-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search domains or records..."
          oninput="handleSearch(this.value)" autocomplete="off" spellcheck="false">
        <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()" title="Clear search"
          style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>
    <div id="controls-bar" class="controls-bar"
      style="padding: 10px 48px; display: flex; justify-content: flex-end; align-items: center; border-bottom: 1px solid var(--border); background-color: var(--bg-main);">
      <div id="pagination-controls" style="display: flex; gap: 8px; align-items: center; font-size: 0.85rem;"></div>
    </div>

    <div class="content">
      <!-- Domains View -->
      <div id="view-domains" class="domain-list">
        <!-- Rendered via JS -->
      </div>

      <!-- DNS View -->
      <div id="view-dns" class="domain-list hidden"></div>

      <!-- Certs View -->
      <div id="view-certs" class="domain-list hidden">
        <div class="domain-card" style="padding: 24px;">
          <div id="certs-table-container">Select a domain to view certificate history.</div>
        </div>
      </div>

      <!-- Nameservers View -->
      <div id="view-nshealth" class="domain-list hidden"></div>
    </div>
  </main>

  <script>
    let currentView = 'domains';
    let currentFilter = 'all';
    let pollInterval = null;
    let appState = {};
    let searchQuery = '';
    let currentPage = 1;
    const itemsPerPage = 50;

    let searchDebounceTimer = null;

    function handleSearch(query, immediate = false) {
      const rawQuery = (query || '').toLowerCase().trim();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.style.display = rawQuery ? 'flex' : 'none';
      }
      if (searchDebounceTimer) {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = null;
      }
      const update = () => {
        searchQuery = rawQuery;
        currentPage = 1;
        refreshCurrentView();
      };
      if (immediate || !rawQuery) {
        update();
      } else {
        searchDebounceTimer = setTimeout(update, 200);
      }
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        handleSearch('', true);
        input.focus();
      }
    }

    function setPage(page) {
      currentPage = page;
      refreshCurrentView();
    }

    function refreshCurrentView() {
      if (currentView === 'domains') renderDomains();
      else if (currentView === 'dns') renderDNS();
      else if (currentView === 'nshealth') renderNSHealth();
      else if (currentView === 'certs') fetchCerts();
    }

    function renderPagination(totalItems) {
      const container = document.getElementById('pagination-controls');
      if (!container) return;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      if (totalPages <= 1) {
        container.innerHTML = '';
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';
      let html = `<span style="color: var(--text-muted); margin-right: 8px;">Page ${currentPage} of ${totalPages} (${totalItems} items)</span>`;
      html += `<button onclick="setPage(${currentPage > 1 ? currentPage - 1 : 1})" ${currentPage === 1 ? 'disabled' : ''} style="padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: ${currentPage === 1 ? 'not-allowed' : 'pointer'}; opacity: ${currentPage === 1 ? '0.5' : '1'};">Prev</button>`;
      html += `<button onclick="setPage(${currentPage < totalPages ? currentPage + 1 : totalPages})" ${currentPage === totalPages ? 'disabled' : ''} style="padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: ${currentPage === totalPages ? 'not-allowed' : 'pointer'}; opacity: ${currentPage === totalPages ? '0.5' : '1'};">Next</button>`;
      container.innerHTML = html;
    }

    function formatSince(sinceISO) {
      if (!sinceISO) return '';
      const since = new Date(sinceISO);
      const now = new Date();
      const diffMs = now - since;
      
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins < 1) return 'just now';
      if (diffMins < 60) return `${diffMins}m`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d`;
    }


    // Theme initialization with localStorage persistence and query param support
    const urlParams = new URLSearchParams(window.location.search);
    const paramTheme = urlParams.get('theme');
    const savedTheme = localStorage.getItem('theme');
    if (paramTheme === 'dark' || paramTheme === 'light') {
      document.documentElement.setAttribute('data-theme', paramTheme);
    } else if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) { }
    }

    function switchView(view) {
      if (view === 'nshealth') {
        const nsHealthChecks = appState.ns_health || appState.ns_health_checks || {};
        if (Object.keys(nsHealthChecks).length === 0) {
          view = 'domains';
        }
      }
      if (currentView !== view) {
        currentFilter = 'all'; // reset filter on view switch
        currentPage = 1;
        searchQuery = '';
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = null;
        }
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.value = '';
        }
        const clearBtn = document.getElementById('searchClearBtn');
        if (clearBtn) {
          clearBtn.style.display = 'none';
        }
      }
      currentView = view;
      if (window.location.hash !== '#' + view && !window.location.hash.startsWith('#' + view + ':') && !window.location.hash.startsWith('#open:') && !window.location.hash.startsWith('#dns:')) {
        history.replaceState(null, '', '#' + view);
      }
      document.getElementById('nav-domains').classList.toggle('active', view === 'domains');
      document.getElementById('nav-dns').classList.toggle('active', view === 'dns');
      document.getElementById('nav-certs').classList.toggle('active', view === 'certs');
      const navNS = document.getElementById('nav-nshealth');
      if (navNS) navNS.classList.toggle('active', view === 'nshealth');

      document.getElementById('view-domains').classList.toggle('hidden', view !== 'domains');
      document.getElementById('view-dns').classList.toggle('hidden', view !== 'dns');
      document.getElementById('view-certs').classList.toggle('hidden', view !== 'certs');
      const viewNS = document.getElementById('view-nshealth');
      if (viewNS) viewNS.classList.toggle('hidden', view !== 'nshealth');

      const controlsBar = document.getElementById('controls-bar');
      if (controlsBar) controlsBar.classList.toggle('hidden', view === 'certs');

      // Update stats on view switch without requiring a full fetch
      if (view === 'domains') {
        renderDomains();
      } else if (view === 'dns') {
        renderDNS();
      } else if (view === 'certs') {
        renderCertsInit();
      } else if (view === 'nshealth') {
        renderNSHealth();
      }
    }

    function toggleFilter(filter) {
      if (currentFilter === filter) {
        currentFilter = 'all';
      } else {
        currentFilter = filter;
      }
      if (currentView === 'domains') {
        renderDomains();
      } else if (currentView === 'dns') {
        renderDNS();
      } else if (currentView === 'nshealth') {
        renderNSHealth();
      }
    }

    function renderStats(total, healthy, issues, expiringDomains, expiringCerts, totalSlaves) {
      document.getElementById('view-stats').innerHTML = `
        <div class="stat-box ${currentFilter === 'all' ? 'active' : ''}" onclick="toggleFilter('all')">
          <span class="stat-label">Total</span>
          <span class="stat-value">${total}</span>
        </div>
        <div class="stat-box ${currentFilter === 'healthy' ? 'active' : ''}" onclick="toggleFilter('healthy')">
          <span class="stat-label">Healthy</span>
          <span class="stat-value"><span class="status-dot ok"></span>${healthy}</span>
        </div>
        <div class="stat-box ${currentFilter === 'issues' ? 'active' : ''}" style="${issues > 0 && currentFilter !== 'issues' ? 'border-color: var(--error);' : ''}" onclick="toggleFilter('issues')">
          <span class="stat-label">Issues</span>
          <span class="stat-value"><span class="status-dot error"></span>${issues}</span>
        </div>
        ${currentView === 'domains' ? `
        <div class="stat-box ${currentFilter === 'expiring' ? 'active' : ''}" style="${expiringDomains > 0 && currentFilter !== 'expiring' ? 'border-color: var(--warning);' : ''}" onclick="toggleFilter('expiring')">
          <span class="stat-label">Expiring/Expired Domains</span>
          <span class="stat-value" style="${expiringDomains > 0 ? 'color: var(--warning);' : ''}">${expiringDomains}</span>
        </div>` : ''}
        ${currentView === 'dns' ? `
        <div class="stat-box ${currentFilter === 'expiring' ? 'active' : ''}" style="${expiringCerts > 0 && currentFilter !== 'expiring' ? 'border-color: var(--warning);' : ''}" onclick="toggleFilter('expiring')">
          <span class="stat-label">Expiring SSL</span>
          <span class="stat-value" style="${expiringCerts > 0 ? 'color: var(--warning);' : ''}">${expiringCerts}</span>
        </div>` : ''}
        ${currentView === 'nshealth' ? `
        <div class="stat-box ${currentFilter === 'slaves' ? 'active' : ''}" onclick="toggleFilter('slaves')">
          <span class="stat-label">Replicas / Slaves</span>
          <span class="stat-value" style="color: var(--primary); font-weight: 600;">${totalSlaves || 0}</span>
        </div>` : ''}
      `;
    }

    function formatUserTzDate(isoString) {
      if (!isoString) return '';

      let dateStr = '';
      let tz = '';
      try {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {
        tz = '';
      }
      const tzSuffix = tz ? ` (${tz})` : '';

      try {
        if (window.Temporal && window.Temporal.Instant) {
          dateStr = Temporal.Instant.from(isoString).toLocaleString(navigator.language);
        } else {
          dateStr = new Date(isoString).toLocaleString();
        }
      } catch (e) {
        dateStr = new Date(isoString).toLocaleString();
      }
      return dateStr + tzSuffix;
    }

    function updateHeaderTimestamps() {
      const el = document.getElementById('last-updated');
      if (!el) return;
      if (appState.last_updated) {
        const updatedDate = formatUserTzDate(appState.last_updated);
        let txt = `Last Updated: ${escapeHTML(updatedDate)}`;
        if (appState.next_refresh) {
          const nextDate = formatUserTzDate(appState.next_refresh);
          txt += `<br>Next Update: ${escapeHTML(nextDate)}`;
        }
        el.innerHTML = txt;
      } else {
        el.innerText = 'Initializing... (Please wait)';
      }
    }

    function updateRenewalPricing() {
      if (!appState || !appState.rdap_checks) return;
      let total = 0;
      Object.values(appState.rdap_checks).forEach(c => {
        if (c && c.renewal_price) total += c.renewal_price;
      });
      const el = document.getElementById('total-renewal-cost');
      if (el) el.innerText = total.toFixed(2);
      
      const container = document.getElementById('renewal-pricing');
      if (container) {
        if (total > 0) {
          container.style.display = 'block';
        } else {
          container.style.display = 'none';
        }
      }
    }

    async function pollState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.status !== 'initializing' && data.last_updated) {
          const wasInitial = !appState.last_updated;
          if (data.last_updated !== appState.last_updated) {
            appState = data;
            updateHeaderTimestamps();
            updateRenewalPricing();
            updateNavVisibility();
            if (currentView === 'domains') {
              renderDomains();
            } else if (currentView === 'dns') {
              renderDNS();
            } else if (currentView === 'certs') {
              renderCertsInit();
            } else if (currentView === 'nshealth') {
              renderNSHealth();
            }
          }
          if (wasInitial && pollInterval) {
            clearInterval(pollInterval);
            pollInterval = setInterval(pollState, 15000);
          }
        }
      } catch (err) {
        // Retry silently on next cycle
      }
    }

    function updateNavVisibility() {
      const nsHealthChecks = appState.ns_health || appState.ns_health_checks || {};
      const hasNSHealth = Object.keys(nsHealthChecks).length > 0;
      const navNS = document.getElementById('nav-nshealth');
      if (navNS) {
        navNS.style.display = hasNSHealth ? 'block' : 'none';
      }
      if (!hasNSHealth && currentView === 'nshealth') {
        switchView('domains');
      }
    }

    function initialize() {
      updateHeaderTimestamps();
      updateNavVisibility();
      pollState();

      const hash = window.location.hash.replace('#', '');
      if (['domains', 'dns', 'certs', 'nshealth'].includes(hash)) {
        switchView(hash);
      } else if (hash.startsWith('certs:')) {
        switchView('certs');
      } else if (hash.startsWith('dns:')) {
        const target = decodeURIComponent(hash.substring(4)).toLowerCase();
        switchView('dns');
        setTimeout(() => {
          const card = document.querySelector(`details[data-search*="${CSS.escape(target)}"]`);
          if (card) card.open = true;
        }, 50);
      } else if (hash.startsWith('nshealth:')) {
        const target = hash.substring(9);
        switchView('nshealth');
        setTimeout(() => {
          const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
          if (card) card.open = true;
        }, 50);
      } else if (hash.startsWith('open:')) {
        const target = hash.substring(5);
        switchView('domains');
        setTimeout(() => {
          const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
          if (card) card.open = true;
        }, 50);
      } else {
        switchView('domains');
      }

      window.addEventListener('hashchange', () => {
        const view = window.location.hash.replace('#', '');
        if (['domains', 'dns', 'certs', 'nshealth'].includes(view) && currentView !== view) {
          switchView(view);
        } else if (view.startsWith('certs:')) {
          switchView('certs');
        } else if (view.startsWith('dns:')) {
          const target = decodeURIComponent(view.substring(4)).toLowerCase();
          switchView('dns');
          setTimeout(() => {
            const card = document.querySelector(`details[data-search*="${CSS.escape(target)}"]`);
            if (card) card.open = true;
          }, 50);
        } else if (view.startsWith('nshealth:')) {
          const target = view.substring(9);
          switchView('nshealth');
          setTimeout(() => {
            const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
            if (card) card.open = true;
          }, 50);
        } else if (view.startsWith('open:')) {
          const target = view.substring(5);
          switchView('domains');
          setTimeout(() => {
            const card = document.querySelector(`details[data-search="${CSS.escape(target)}"]`);
            if (card) card.open = true;
          }, 50);
        }
      });

      // Set live polling
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(pollState, appState.last_updated ? 15000 : 2500);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g,
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    function formatTitleCase(str) {
      if (str === null || str === undefined || str === '') return 'None';
      str = String(str);
      return str.replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/[_-]/g, ' ')
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    function formatCAAValue(val) {
      if (!val) return 'None';
      const trimmed = String(val).trim();
      if (trimmed === ';' || trimmed === '""' || trimmed === "''") {
        return 'Deny All';
      }
      return escapeHTML(val);
    }

    function renderDomains() {
      const container = document.getElementById('view-domains');
      const previouslyOpen = new Set();
      container.querySelectorAll('details.domain-card[open]').forEach(el => {
        const id = el.getAttribute('data-search');
        if (id) previouslyOpen.add(id);
      });
      container.innerHTML = '';

      const rdapChecks = appState.rdap_checks || {};
      const emailChecks = appState.email_checks || {};
      const caaChecks = appState.caa_checks || {};
      const dnssecChecks = appState.dnssec_checks || {};
      const nsHealthChecks = appState.ns_health || appState.ns_health_checks || {};

      let allDomains = new Set(Object.keys(rdapChecks));
      if (allDomains.size === 0) {
        allDomains = new Set([
          ...Object.keys(emailChecks),
          ...Object.keys(caaChecks),
          ...Object.keys(dnssecChecks)
        ]);
      }

      if (allDomains.size === 0) {
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">Monitoring Initializing</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">Initial domain and security checks are running.<br>Results will appear here automatically.</p>
          </div>
        `;
        renderStats(0, 0, 0, 0, 0);
        return;
      }

      let healthyCount = 0;
      let issueCount = 0;
      let expiringCount = 0;

      const domainDataList = [];
      const sortedDomains = Array.from(allDomains).sort((a, b) => a.localeCompare(b));

      const activeCards = [];
      const letGoCards = [];

      for (const domain of sortedDomains) {
        const rdapState = rdapChecks[domain] || {};
        const emailState = emailChecks[domain] || {};
        const dnssecState = dnssecChecks[domain] || {};
        const caaState = caaChecks[domain] || {};
        const nsHealthState = nsHealthChecks[domain] || {};

        let statusClass = 'ok';
        let statusText = 'Healthy';
        let isExpiring = false;

        if (rdapState.status && rdapState.status !== "pending") {
          if (rdapState.expiration) {
            const expDate = new Date(rdapState.expiration);
            const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
            if (daysLeft <= 30) {
              isExpiring = true;
            }
          }
        }

        let badges = [];

        // RED (Critical Errors)
        if (rdapState.registrar_mismatch) {
          badges.push({ label: 'registrar_mismatch', cls: 'error' });
        }

        let hasSuspension = false;
        if (rdapState.domain_status) {
          if (rdapState.domain_status.some(s => s.toLowerCase().includes('clienthold'))) { badges.push({ label: 'epp_client_hold', cls: 'error' }); hasSuspension = true; }
          if (rdapState.domain_status.some(s => s.toLowerCase().includes('serverhold'))) { badges.push({ label: 'epp_server_hold', cls: 'error' }); hasSuspension = true; }
          if (rdapState.domain_status.some(s => s.toLowerCase().includes('pendingdelete'))) { badges.push({ label: 'epp_pending_delete', cls: 'error' }); hasSuspension = true; }
          if (rdapState.domain_status.some(s => s.toLowerCase().includes('redemptionperiod'))) { badges.push({ label: 'epp_redemption_period', cls: 'error' }); hasSuspension = true; }
        }

        let missingNS = false;
        if (!rdapState.is_delegated_zone && (!rdapState.nameservers || rdapState.nameservers.length === 0)) {
          badges.push({ label: 'missing_nameservers', cls: 'error' });
          missingNS = true;
        }

        if (rdapState.status === 'failed' && (rdapState.error || (!rdapState.registrar_mismatch && !hasSuspension && !missingNS))) {
          badges.push({ label: 'rdap_lookup_failed', cls: 'error' });
        }

        if (isExpiring) badges.push({ label: 'expiring_domain', cls: 'error' });

        if (dnssecState.source && dnssecState.valid === false) {
          if (!dnssecState.ds_matches_dnskey) badges.push({ label: 'dnssec_ds_mismatch', cls: 'error' });
          if (!dnssecState.rrsig_valid) badges.push({ label: 'dnssec_rrsig_invalid', cls: 'error' });
          if (!dnssecState.chain_intact && dnssecState.source !== 'local_only') badges.push({ label: 'dnssec_chain_broken', cls: 'error' });
          if (dnssecState.ds_matches_dnskey && dnssecState.rrsig_valid && dnssecState.chain_intact) badges.push({ label: 'bad_dnssec', cls: 'error' }); // Fallback
        }

        const isNSPending = !nsHealthState.servers || nsHealthState.servers.length === 0;
        if (!isNSPending && (nsHealthState.valid === false || (nsHealthState.servers && nsHealthState.servers.some(s => s.error || !s.authoritative || (s.has_dnskey && !s.dnskey_match))))) {
          badges.push({ label: 'ns_health_issue', cls: 'error' });
        }

        // YELLOW (Warnings)
        if (emailState.status === 'mismatch') badges.push({ label: 'mx_mismatch', cls: 'warning' });
        if (emailState.status && emailState.status !== 'failed') {
          if (!emailState.spf) badges.push({ label: 'missing_spf', cls: 'warning' });
          if (!emailState.dmarc) badges.push({ label: 'missing_dmarc', cls: 'warning' });
          if (emailState.dkim_expected && (!emailState.dkim_valid || emailState.dkim_valid.length === 0)) badges.push({ label: 'missing_dkim', cls: 'warning' });
        }

        if (caaState.error) badges.push({ label: 'caa_lookup_error', cls: 'warning' });
        if (caaState.valid === false) badges.push({ label: 'caa_invalid', cls: 'warning' });
        if (caaState.unknown_cas && caaState.unknown_cas.length > 0) badges.push({ label: 'caa_unauthorized_ca', cls: 'warning' });

        if (badges.length > 0) {
          if (badges.some(b => b.cls === 'error')) {
            statusClass = 'error';
          } else {
            statusClass = 'warning';
          }
        } else if (rdapState.status === 'pending') {
          statusClass = 'unknown';
        }

        if (rdapState.allow_expiry) {
          statusClass = 'unknown';
          statusText = 'Let Go';
          badges = [{ label: 'allow_expiry', cls: 'warning' }];
        }

        let labelsHtml = '';
        if (badges.length > 0) {
          labelsHtml = badges.map(b => `<span class="badge ${b.cls}">${b.label}</span>`).join('');
        } else if (rdapState.status === 'pending' || statusClass === 'unknown') {
          labelsHtml = `<span class="badge" style="color: var(--text-muted); background: var(--border);">pending</span>`;
        } else {
          labelsHtml = `<span class="badge success">healthy</span>`;
        }

        // Add since badge if condition exists
        const renderSince = (state, labelPrefix) => {
           if (state && state.condition && state.condition.since && state.status === 'failed') {
             const sinceStr = formatSince(state.condition.since);
             if (sinceStr) {
               labelsHtml += `<span class="badge error" style="margin-left:4px; opacity: 0.8;" title="${labelPrefix} failing since ${new Date(state.condition.since).toLocaleString()}">⏱ ${sinceStr}</span>`;
             }
           }
        };
        
        renderSince(rdapState, "RDAP");
        renderSince(emailState, "Email");
        renderSince(dnssecState, "DNSSEC");
        renderSince(caaState, "CAA");
        renderSince(nsHealthState, "NS Health");

        if (statusClass === 'error' || statusClass === 'warning') {
          issueCount++;
        } else if (statusClass === 'ok') {
          healthyCount++;
        }
        if (isExpiring) {
          expiringCount++;
        }

        domainDataList.push({
          domain,
          rdapState,
          emailState,
          dnssecState,
          caaState,
          nsHealthState,
          statusClass,
          statusText,
          isExpiring,
          labelsHtml
        });
      }

      let filteredDomains = domainDataList;
      if (searchQuery) {
        filteredDomains = filteredDomains.filter(item => item.domain.toLowerCase().includes(searchQuery));
      }
      if (currentFilter === 'healthy') {
        filteredDomains = filteredDomains.filter(item => item.statusClass === 'ok');
      } else if (currentFilter === 'issues') {
        filteredDomains = filteredDomains.filter(item => item.statusClass === 'error' || item.statusClass === 'warning');
      } else if (currentFilter === 'expiring') {
        filteredDomains = filteredDomains.filter(item => item.isExpiring);
      }

      const totalFiltered = filteredDomains.length;
      renderPagination(totalFiltered);

      if (totalFiltered === 0) {
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">No Domains Found</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">No domains match the current search or filter criteria.</p>
          </div>
        `;
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedDomains = filteredDomains.slice(startIndex, startIndex + itemsPerPage);

      for (const item of paginatedDomains) {
        const domain = item.domain;
        const rdapState = item.rdapState;
        const emailState = item.emailState;
        const dnssecState = item.dnssecState;
        const caaState = item.caaState;
        const nsHealthState = item.nsHealthState;
        const statusClass = item.statusClass;
        const statusText = item.statusText;
        const isExpiring = item.isExpiring;
        const labelsHtml = item.labelsHtml;

        let emailHtml = `<div class="detail-panel"><h3>Email</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (emailState.status) {
          const mxs = (emailState.mx && emailState.mx.length > 0) ? `<ul class="data-list"><li>${emailState.mx.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const isDkimValid = (emailState.dkim_valid && emailState.dkim_valid.length > 0);
          let dkimDisplay = 'Not Configured';
          if (isDkimValid) {
            dkimDisplay = `<span style="color: var(--success)">Valid (${escapeHTML(emailState.dkim_valid.join(', '))})</span>`;
          } else if (emailState.dkim_expected) {
            dkimDisplay = '<span style="color: var(--warning)">Missing</span>';
          }

          let emailStatusColor = 'var(--success)';
          if (emailState.status === 'failed' || emailState.status === 'hijacked') {
            emailStatusColor = 'var(--error)';
          } else if (emailState.status === 'warning' || emailState.status === 'mismatch') {
            emailStatusColor = 'var(--warning)';
          }

          emailHtml = `
            <div class="detail-panel">
              <h3>Email Security</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: ${emailStatusColor}">${formatTitleCase(emailState.status)}</div></div>
              <div class="detail-row"><div class="detail-label">SPF:</div><div class="detail-value">${emailState.spf ? 'Configured' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DMARC:</div><div class="detail-value">${emailState.dmarc ? 'Configured' : 'Missing'}</div></div>
              <div class="detail-row"><div class="detail-label">DKIM:</div><div class="detail-value">${dkimDisplay}</div></div>
              <div class="detail-row"><div class="detail-label">MX Records:</div><div class="detail-value" style="text-transform: lowercase;">${mxs}</div></div>
              ${emailState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error)">${escapeHTML(emailState.error)}</div></div>` : ''}
            </div>`;
        }

        let rdapHtml = `
        <div class="detail-panel">
          <h3>Domain Information</h3>
          <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: var(--text-muted)">Not Configured</div></div>
        </div>`;

        let badgeHtml = '';
        let expText = 'Unknown';
        if (rdapState.status === 'pending') {
          badgeHtml = `<span class="badge" style="color: var(--text-muted); background: var(--border);">pending</span>`;
        } else if (rdapState.status) {
          expText = rdapState.expiration ? new Date(rdapState.expiration).toLocaleString() : 'Unknown';

          if (rdapState.expiration) {
            const expDate = new Date(rdapState.expiration);
            const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
            if (daysLeft < 0) {
              badgeHtml = `<span class="badge error">Expired (${Math.abs(daysLeft)}d ago)</span>`;
            } else if (daysLeft <= 30) {
              badgeHtml = `<span class="badge warning">${daysLeft}d left</span>`;
            } else {
              badgeHtml = `<span class="badge success">${daysLeft}d left</span>`;
            }
          }

          const ns = (rdapState.nameservers && rdapState.nameservers.length > 0) ? `<ul class="data-list"><li>${rdapState.nameservers.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';
          const statuses = (rdapState.domain_status && rdapState.domain_status.length > 0) ? `<ul class="data-list"><li>${rdapState.domain_status.map(formatTitleCase).map(escapeHTML).join('</li><li>')}</li></ul>` : 'Active';

          if (rdapState.is_delegated_zone) {
            rdapHtml = `
              <div class="detail-panel">
                <h3>Delegated Zone</h3>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value" style="text-transform: lowercase;">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value">Monitored</div></div>
              </div>`;
          } else {
            let regDisplay = escapeHTML(rdapState.registrar) || 'None reported';
            if (rdapState.registrar_iana_id) {
              regDisplay += ` (IANA ${escapeHTML(rdapState.registrar_iana_id)})`;
            }
            if (rdapState.registrar_mismatch) {
              regDisplay += ` <span class="badge error" style="margin-left: 8px; font-size: 0.75rem; vertical-align: middle;">Mismatch (Expected: ${escapeHTML(rdapState.expected_registrar)})</span>`;
            }

            rdapHtml = `
              <div class="detail-panel">
                <h3>Domain Information</h3>
                <div class="detail-row"><div class="detail-label">Registrar:</div><div class="detail-value">${regDisplay}</div></div>
                <div class="detail-row"><div class="detail-label">Expiration:</div><div class="detail-value">${expText}</div></div>
                <div class="detail-row"><div class="detail-label">Nameservers:</div><div class="detail-value" style="text-transform: lowercase;">${ns}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="text-transform: capitalize;">${statuses}</div></div>
                <div class="detail-row"><div class="detail-label">DNSSEC:</div><div class="detail-value">${rdapState.dnssec ? 'Enabled' : 'Disabled'}</div></div>
                ${rdapState.source ? `<div class="detail-row"><div class="detail-label">Lookup Source:</div><div class="detail-value" style="text-transform: uppercase; font-size: 0.85em; opacity: 0.8;">${escapeHTML(rdapState.source)}</div></div>` : ''}
                ${rdapState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error)">${escapeHTML(rdapState.error)}</div></div>` : ''}
              </div>`;
          }
        }

        let dnssecHtml = `<div class="detail-panel"><h3>DNSSEC</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (dnssecState.source) {
          dnssecHtml = `
            <div class="detail-panel">
              <h3>DNSSEC Validation</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="${dnssecState.valid ? 'color: var(--success)' : 'color: var(--error)'}">${dnssecState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 1 (Local):</div><div class="detail-value">${dnssecState.ds_matches_dnskey && dnssecState.rrsig_valid ? 'Pass' : 'Fail'}</div></div>
              <div class="detail-row"><div class="detail-label">Tier 2 (DoH):</div><div class="detail-value">${dnssecState.chain_intact ? 'Pass' : (dnssecState.source === 'local_only' ? 'N/A' : 'Fail')}</div></div>
              <div class="detail-row"><div class="detail-label">Algorithms:</div><div class="detail-value">${(dnssecState.algorithms || []).join(', ') || 'None'}</div></div>
              ${!dnssecState.valid && dnssecState.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error)">${escapeHTML(dnssecState.error)}</div></div>` : ''}
            </div>
          `;
        }

        let caaHtml = `<div class="detail-panel"><h3>CAA Records</h3><p class="detail-value" style="color: var(--text-muted)">Not Configured</p></div>`;
        if (caaState.issue || caaState.issuewild || caaState.issuemail || caaState.error) {
          caaHtml = `
            <div class="detail-panel">
              <h3>CAA Records</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="${caaState.valid ? 'color: var(--success)' : 'color: var(--error)'}">${caaState.valid ? 'Valid' : 'Invalid'}</div></div>
              <div class="detail-row"><div class="detail-label">Issue:</div><div class="detail-value">${(caaState.issue || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueWild:</div><div class="detail-value">${(caaState.issuewild || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              <div class="detail-row"><div class="detail-label">IssueMail:</div><div class="detail-value">${(caaState.issuemail || []).map(formatCAAValue).join(', ') || 'None'}</div></div>
              ${caaState.unknown_cas && caaState.unknown_cas.length > 0 ? `<div class="detail-row"><div class="detail-label">Unknown CAs:</div><div class="detail-value" style="color: var(--warning)">${caaState.unknown_cas.map(formatCAAValue).join(', ')}</div></div>` : ''}
            </div>
          `;
        }

        let nsHealthHtml = '';
        if (nsHealthState && (nsHealthState.servers || nsHealthState.primary)) {
          const isNSPending = !nsHealthState.servers || nsHealthState.servers.length === 0;
          const statusText = isNSPending ? 'Pending' : (nsHealthState.valid ? 'In Sync' : 'Issues Detected');
          const statusColor = isNSPending ? 'var(--warning)' : (nsHealthState.valid ? 'var(--success)' : 'var(--error)');
          const serverCount = nsHealthState.servers ? nsHealthState.servers.length : 0;
          nsHealthHtml = `
            <div class="detail-panel">
              <h3>Nameserver Health</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: ${statusColor}; font-weight: 600;">${statusText}</div></div>
              <div class="detail-row"><div class="detail-label">Servers Checked:</div><div class="detail-value">${isNSPending ? 'Query Pending' : `${serverCount} (${escapeHTML(nsHealthState.primary || 'expected_ns[0]')})`}</div></div>
              <div class="detail-row"><div class="detail-label">Full Inspection:</div><div class="detail-value"><a href="#nshealth:${escapeHTML(domain.toLowerCase())}" onclick="switchView('nshealth');" style="color: var(--primary); text-decoration: none; font-weight: 500;">Open Nameservers Dashboard &rarr;</a></div></div>
            </div>
          `;
        }

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search', domain.toLowerCase());
        if (window.location.hash === '#open:' + domain.toLowerCase() || previouslyOpen.has(domain.toLowerCase())) {
          card.open = true;
        }

        const chevronHtml = `<svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

        card.innerHTML = `
          <summary class="domain-header domain-header-domains">
            <div class="domain-header-left">
              <div class="domain-title" style="text-transform: lowercase;">${escapeHTML(domain)}</div>
              <div class="domain-expiry">
                ${badgeHtml ? badgeHtml : `<span style="opacity: 0.6;">${expText}</span>`}
              </div>
            </div>
            <div class="domain-header-right">
              <div class="domain-status">
                <span class="status-label">
                  ${labelsHtml}
                </span>
              </div>
              ${chevronHtml}
            </div>
          </summary>
          <div class="domain-details">
            ${rdapHtml}
            ${emailHtml}
            ${dnssecHtml}
            ${caaHtml}
            ${nsHealthHtml}
          </div>
        `;
        if (rdapState.allow_expiry) {
          letGoCards.push(card);
        } else {
          activeCards.push(card);
        }
      } // end of for loop

      activeCards.forEach(card => container.appendChild(card));

      if (letGoCards.length > 0) {
        const letGoHeader = document.createElement('div');
        letGoHeader.innerHTML = '<h3 style="margin: 32px 0 16px 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 1.1rem;">Domains Being Let Go</h3>';
        container.appendChild(letGoHeader);
        letGoCards.forEach(card => container.appendChild(card));
      }

      if (currentView === 'domains') {
        renderStats(allDomains.size, healthyCount, issueCount, expiringCount, 0, 0);
      }
    }

    function renderNSHealth() {
      const container = document.getElementById('view-nshealth');
      if (!container) return;
      const previouslyOpen = new Set();
      container.querySelectorAll('details.domain-card[open]').forEach(el => {
        const id = el.getAttribute('data-search');
        if (id) previouslyOpen.add(id);
      });
      container.innerHTML = '';

      const nsHealthChecks = appState.ns_health || appState.ns_health_checks || {};
      const domains = Object.keys(nsHealthChecks).sort((a, b) => a.localeCompare(b));

      if (domains.length === 0) {
        renderStats(0, 0, 0, 0, 0, 0);
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">No Nameserver Health Configured</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">To monitor primary & secondary nameserver synchronization and health, enable <code>verify_ns_health: true</code> in your configuration.</p>
          </div>
        `;
        return;
      }

      let healthyCount = 0;
      let issueCount = 0;
      let totalSlaves = 0;

      domains.forEach(d => {
        const h = nsHealthChecks[d] || {};
        const servers = h.servers || [];
        const isPending = !h.servers || h.servers.length === 0;
        const hasIssue = !isPending && (h.valid === false || servers.some(s => s.error || !s.authoritative || (s.has_dnskey && !s.dnskey_match)));
        if (hasIssue) {
          issueCount++;
        } else if (!isPending) {
          healthyCount++;
        }
        totalSlaves += servers.filter(s => !s.is_primary).length;
      });

      renderStats(domains.length, healthyCount, issueCount, 0, 0, totalSlaves);

      let filteredDomains = domains;
      if (searchQuery) {
        filteredDomains = filteredDomains.filter(d => d.toLowerCase().includes(searchQuery));
      }
      if (currentFilter === 'healthy') {
        filteredDomains = filteredDomains.filter(domain => {
          const h = nsHealthChecks[domain] || {};
          const servers = h.servers || [];
          const isPending = !h.servers || h.servers.length === 0;
          const hasIssue = !isPending && (h.valid === false || servers.some(s => s.error || !s.authoritative || (s.has_dnskey && !s.dnskey_match)));
          return !hasIssue && !isPending;
        });
      } else if (currentFilter === 'issues') {
        filteredDomains = filteredDomains.filter(domain => {
          const h = nsHealthChecks[domain] || {};
          const servers = h.servers || [];
          const isPending = !h.servers || h.servers.length === 0;
          return !isPending && (h.valid === false || servers.some(s => s.error || !s.authoritative || (s.has_dnskey && !s.dnskey_match)));
        });
      } else if (currentFilter === 'slaves') {
        filteredDomains = filteredDomains.filter(domain => {
          const h = nsHealthChecks[domain] || {};
          const servers = h.servers || [];
          return servers.some(s => !s.is_primary);
        });
      }

      const totalFiltered = filteredDomains.length;
      renderPagination(totalFiltered);

      if (totalFiltered === 0) {
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">No Nameserver Health Records Found</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">No nameservers match the current search or filter criteria.</p>
          </div>
        `;
        return;
      }
      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedDomains = filteredDomains.slice(startIndex, startIndex + itemsPerPage);

      paginatedDomains.forEach(domain => {
        const h = nsHealthChecks[domain] || {};
        const servers = h.servers || [];
        const isPending = !h.servers || h.servers.length === 0;
        const hasIssue = !isPending && (h.valid === false || servers.some(s => s.error || !s.authoritative || (s.has_dnskey && !s.dnskey_match)));
        const slaveServers = servers.filter(s => !s.is_primary);
        const primaryServer = servers.find(s => s.is_primary);

        let primaryHtml = '';
        if (primaryServer) {
          const aaBadge = primaryServer.authoritative
            ? '<span style="color: var(--success); font-weight: 600;">Pass (Authoritative Answer)</span>'
            : '<span style="color: var(--error); font-weight: 600;">Fail (AA Missing)</span>';
          let dnskeyBadge = '<span style="color: var(--text-muted)">Unsigned</span>';
          if (primaryServer.has_dnskey) {
            dnskeyBadge = '<span style="color: var(--success); font-weight: 600;">Active (Signed Zone)</span>';
          }
          primaryHtml = `
            <div class="detail-panel">
              <h3>Primary Nameserver (Master)</h3>
              <div class="detail-row"><div class="detail-label">Server:</div><div class="detail-value" style="font-weight: 600;">${escapeHTML(primaryServer.nameserver)}</div></div>
              <div class="detail-row"><div class="detail-label">Role:</div><div class="detail-value">Primary Master (expected_ns[0])</div></div>
              <div class="detail-row"><div class="detail-label">Authoritative (AA):</div><div class="detail-value">${aaBadge}</div></div>
              <div class="detail-row"><div class="detail-label">SOA Serial:</div><div class="detail-value" style="font-family: monospace; font-size: 1.05em; font-weight: 600;">${primaryServer.soa_serial || 'Unavailable'}</div></div>
              <div class="detail-row"><div class="detail-label">DNSKEY / DNSSEC:</div><div class="detail-value">${dnskeyBadge}</div></div>
              ${primaryServer.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error);">${escapeHTML(primaryServer.error)}</div></div>` : ''}
            </div>
          `;
        } else {
          primaryHtml = `
            <div class="detail-panel">
              <h3>Primary Nameserver</h3>
              <div class="detail-row"><div class="detail-label">Server:</div><div class="detail-value">${escapeHTML(h.primary || 'expected_ns[0]')}</div></div>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: var(--warning);">Query Pending</div></div>
            </div>
          `;
        }

        let secondaryHtml = '';
        if (slaveServers.length > 0) {
          const slaveCards = slaveServers.map(s => {
            const aaBadge = s.authoritative
              ? '<span style="color: var(--success); font-weight: 600;">Pass (AA)</span>'
              : '<span style="color: var(--error); font-weight: 600;">Fail (No AA)</span>';

            let serialDisplay = s.soa_serial ? `${s.soa_serial}` : 'Unavailable';
            let syncBadge = '';
            if (primaryServer && primaryServer.soa_serial && s.soa_serial) {
              if (s.soa_serial === primaryServer.soa_serial) {
                syncBadge = ' <span class="badge success" style="margin-left: 6px; font-size: 0.72rem;">Synchronized</span>';
              } else if (s.soa_serial < primaryServer.soa_serial) {
                const diff = primaryServer.soa_serial - s.soa_serial;
                syncBadge = ` <span class="badge error" style="margin-left: 6px; font-size: 0.72rem;">Lagging (-${diff})</span>`;
              } else {
                syncBadge = ' <span class="badge warning" style="margin-left: 6px; font-size: 0.72rem;">Ahead</span>';
              }
            }

            let dnskeyDisplay = '<span style="color: var(--text-muted)">Unsigned</span>';
            if (s.has_dnskey) {
              dnskeyDisplay = s.dnskey_match
                ? '<span style="color: var(--success); font-weight: 600;">Replicated (Matching Keys)</span>'
                : '<span style="color: var(--error); font-weight: 600;">Mismatch (Keys Differ)</span>';
            } else if (!s.dnskey_match) {
              dnskeyDisplay = '<span style="color: var(--error); font-weight: 600;">DNSKEY Missing on Secondary</span>';
            }

            return `
              <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
                <div class="detail-row"><div class="detail-label">Server:</div><div class="detail-value" style="font-weight: 600;">${escapeHTML(s.nameserver)}</div></div>
                <div class="detail-row"><div class="detail-label">Authoritative (AA):</div><div class="detail-value">${aaBadge}</div></div>
                <div class="detail-row"><div class="detail-label">SOA Serial:</div><div class="detail-value" style="font-family: monospace;">${serialDisplay}${syncBadge}</div></div>
                <div class="detail-row"><div class="detail-label">DNSKEY Sync:</div><div class="detail-value">${dnskeyDisplay}</div></div>
                ${s.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error);">${escapeHTML(s.error)}</div></div>` : ''}
              </div>
            `;
          }).join('');

          secondaryHtml = `
            <div class="detail-panel">
              <h3>Secondary / Slave Nameservers</h3>
              ${slaveCards}
            </div>
          `;
        } else {
          secondaryHtml = `
            <div class="detail-panel">
              <h3>Secondary / Slave Nameservers</h3>
              <div class="detail-row"><div class="detail-label">Secondary NS:</div><div class="detail-value" style="color: var(--text-muted);">None configured (single master model)</div></div>
              <div class="detail-row"><div class="detail-label">Replication:</div><div class="detail-value">Primary-only validation</div></div>
            </div>
          `;
        }

        let overallStatusHtml = h.valid
          ? '<span style="color: var(--success); font-weight: 600;">Fully Synchronized & Authoritative</span>'
          : '<span style="color: var(--error); font-weight: 600;">Replication or Authority Issues Detected</span>';
        if (isPending) {
          overallStatusHtml = '<span style="color: var(--text-muted);">Initial Check Pending</span>';
        }

        const overviewHtml = `
          <div class="detail-panel">
            <h3>Zone Replication Overview</h3>
            <div class="detail-row"><div class="detail-label">Overall Health:</div><div class="detail-value">${overallStatusHtml}</div></div>
            <div class="detail-row"><div class="detail-label">Total Servers:</div><div class="detail-value">${servers.length} (${1 + slaveServers.length} expected)</div></div>
            <div class="detail-row"><div class="detail-label">DNSKEY Consistency:</div><div class="detail-value">${h.valid && servers.every(s => s.dnskey_match) ? 'Compliant (Identical Keys)' : (slaveServers.length === 0 ? 'Single Master' : 'Check servers')}</div></div>
            ${h.error ? `<div class="detail-row"><div class="detail-label">Alert:</div><div class="detail-value" style="color: var(--error); font-weight: 600;">${escapeHTML(h.error)}</div></div>` : ''}
          </div>
        `;

        let statusBadgeHtml = '';
        if (isPending) {
          statusBadgeHtml = `<span class="badge" style="color: var(--text-muted); background: var(--border);">pending</span>`;
        } else if (hasIssue) {
          statusBadgeHtml = `<span class="badge error">issues</span>`;
        } else {
          statusBadgeHtml = `<span class="badge success">healthy</span>`;
        }

        let replicaInfoHtml = '';
        if (slaveServers.length > 0) {
          replicaInfoHtml = `<span class="badge" style="background: var(--bg-hover); color: var(--text-muted); font-size: 0.75rem;">${slaveServers.length} replica${slaveServers.length > 1 ? 's' : ''}</span>`;
        } else {
          replicaInfoHtml = `<span style="opacity: 0.6; font-size: 0.85rem;">primary only</span>`;
        }

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search', domain.toLowerCase());
        const hash = window.location.hash.replace('#', '');
        if (hash === 'nshealth:' + domain.toLowerCase() || hash === 'open:' + domain.toLowerCase() || previouslyOpen.has(domain.toLowerCase())) {
          card.open = true;
        }

        const chevronHtml = `<svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

        card.innerHTML = `
          <summary class="domain-header domain-header-domains">
            <div class="domain-header-left">
              <div class="domain-title" style="text-transform: lowercase;">${escapeHTML(domain)}</div>
              <div class="domain-expiry">
                ${replicaInfoHtml}
              </div>
            </div>
            <div class="domain-header-right">
              <div class="domain-status">
                <span class="status-label">
                  ${statusBadgeHtml}
                </span>
              </div>
              ${chevronHtml}
            </div>
          </summary>
          <div class="domain-details">
            ${primaryHtml}
            ${secondaryHtml}
            ${overviewHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }


    function renderDNS() {
      const container = document.getElementById('view-dns');
      const previouslyOpen = new Set();
      container.querySelectorAll('details.domain-card[open]').forEach(el => {
        const id = el.getAttribute('data-search-id');
        if (id) previouslyOpen.add(id);
      });
      container.innerHTML = '';

      const dnsChecks = appState.dns_checks || {};
      const dnsKeys = Object.keys(dnsChecks).sort((a, b) => a.localeCompare(b));

      if (dnsKeys.length === 0) {
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">DNS Checks Initializing</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">DNS record verification is running.<br>Records will appear here automatically.</p>
          </div>
        `;
        renderStats(0, 0, 0, 0, 0);
        return;
      }

      let healthyCount = 0;
      let issueCount = 0;
      let expiringCertCount = 0;

      const dnsDataList = [];
      for (const key of dnsKeys) {
        const state = dnsChecks[key] || {};
        const hasSSLIssue = !state.skip_ssl && state.ssl_days !== undefined && (state.ssl_days === -9998 || (state.ssl_days < 0 && state.ssl_days !== -9999));
        if (state.status === 'failed' || state.status === 'api_error' || state.status === 'mismatch' || hasSSLIssue) {
          issueCount++;
        } else if (state.status === 'ok' || state.status === 'ok_flattened') {
          healthyCount++;
        }
        if (!state.skip_ssl && state.ssl_days !== undefined && state.ssl_days !== -9999 && state.ssl_days !== -9998 && state.ssl_days <= 30) {
          expiringCertCount++;
        }

        let statusClass = 'ok';
        let statusText = 'Healthy';

        let badges = [];
        if (state.status === 'failed' || state.status === 'api_error') {
          badges.push({ label: 'dns_failed', cls: 'error' });
        } else if (state.status === 'mismatch') {
          badges.push({ label: 'dns_mismatch', cls: 'warning' });
        }

        const name = escapeHTML(state.name || state.hostname || 'Unknown');
        const hostname = escapeHTML(state.hostname || 'Unknown');
        const type = escapeHTML((state.type || 'Unknown').toUpperCase());
        const expectedUl = (state.expected && state.expected.length > 0) ? `<ul class="data-list"><li>${state.expected.map(escapeHTML).join('</li><li>')}</li></ul>` : 'N/A';
        const found = (state.found && state.found.length > 0) ? `<ul class="data-list"><li>${state.found.map(escapeHTML).join('</li><li>')}</li></ul>` : 'None';

        let isExpiringCert = false;
        let sslRow = '';
        let badgeHtml = '';
        if (state.skip_ssl) {
          sslRow = `<div class="detail-row"><div class="detail-label">SSL:</div><div class="detail-value" style="color: var(--text-muted);">Skipped (skip_ssl: true)</div></div>`;
        } else if (state.ssl_days !== undefined && state.ssl_days !== -9999) {
          if (state.ssl_days === -9998 || (state.ssl_days === -1 && state.error)) {
            sslRow = `<div class="detail-row"><div class="detail-label">SSL:</div><div class="detail-value" style="color: var(--warning);">No Cert / Error</div></div>`;
            badgeHtml = `<span class="badge error">No Cert</span>`;
            badges.push({ label: 'ssl_missing', cls: 'error' });
          } else {
            const isExpired = state.ssl_days < 0;
            const absDays = Math.abs(state.ssl_days);
            sslRow = `<div class="detail-row"><div class="detail-label">SSL:</div><div class="detail-value">${!isExpired ? 'Valid (' + state.ssl_days + ' days)' : '<span style="color: var(--error);">Expired (' + absDays + 'd ago)</span>'}</div></div>`;

            if (isExpired) {
              badgeHtml = `<span class="badge error">Expired (${absDays}d)</span>`;
              isExpiringCert = true;
              badges.push({ label: 'ssl_expired', cls: 'error' });
            } else if (state.ssl_days <= 30) {
              badgeHtml = `<span class="badge warning">${state.ssl_days}d left</span>`;
              isExpiringCert = true;
              badges.push({ label: 'ssl_expiring', cls: 'warning' });
            } else {
              badgeHtml = `<span class="badge success">${state.ssl_days}d left</span>`;
            }
          }
        }

        if (badges.length > 0) {
          if (badges.some(b => b.cls === 'error')) {
            statusClass = 'error';
            statusText = 'Issue Detected';
          } else {
            statusClass = 'warning';
            statusText = 'Warning';
          }
        } else if (state.status === 'pending') {
          statusClass = 'unknown';
          statusText = 'Pending';
        } else {
          statusClass = 'ok';
          statusText = 'Healthy';
        }

        let labelsHtml = '';
        if (badges.length > 0) {
          labelsHtml = badges.map(b => `<span class="badge ${b.cls}">${b.label}</span>`).join('');
        } else if (state.status === 'pending' || statusClass === 'unknown') {
          labelsHtml = `<span class="badge" style="color: var(--text-muted); background: var(--border);">pending</span>`;
        } else {
          labelsHtml = `<span class="badge success">healthy</span>`;
        }

        if (state && state.condition && state.condition.since && state.status === 'failed') {
          const sinceStr = formatSince(state.condition.since);
          if (sinceStr) {
            labelsHtml += `<span class="badge error" style="margin-left:4px; opacity: 0.8;" title="DNS failing since ${new Date(state.condition.since).toLocaleString()}">⏱ ${sinceStr}</span>`;
          }
        }

        dnsDataList.push({
          key,
          state,
          name,
          hostname,
          type,
          expectedUl,
          found,
          isExpiringCert,
          sslRow,
          badgeHtml,
          statusClass,
          statusText,
          labelsHtml
        });
      }

      let filteredDNS = dnsDataList;
      if (searchQuery) {
        filteredDNS = filteredDNS.filter(item =>
          item.key.toLowerCase().includes(searchQuery) ||
          (item.state.hostname && item.state.hostname.toLowerCase().includes(searchQuery)) ||
          (item.state.name && item.state.name.toLowerCase().includes(searchQuery))
        );
      }
      if (currentFilter === 'healthy') {
        filteredDNS = filteredDNS.filter(item => item.statusClass === 'ok');
      } else if (currentFilter === 'issues') {
        filteredDNS = filteredDNS.filter(item => item.statusClass === 'error' || item.statusClass === 'warning');
      } else if (currentFilter === 'expiring') {
        filteredDNS = filteredDNS.filter(item => item.isExpiringCert);
      }

      const totalFiltered = filteredDNS.length;
      renderPagination(totalFiltered);

      if (totalFiltered === 0) {
        container.innerHTML = `
          <div class="domain-card" style="padding: 40px 24px; text-align: center;">
            <div style="font-size: 1.15rem; font-weight: 600; margin-bottom: 8px;">No DNS Records Found</div>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">No DNS records match the current search or filter criteria.</p>
          </div>
        `;
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedDNS = filteredDNS.slice(startIndex, startIndex + itemsPerPage);

      for (const item of paginatedDNS) {
        const key = item.key;
        const state = item.state;
        const name = item.name;
        const hostname = item.hostname;
        const type = item.type;
        const expectedUl = item.expectedUl;
        const found = item.found;
        const isExpiringCert = item.isExpiringCert;
        const sslRow = item.sslRow;
        const badgeHtml = item.badgeHtml;
        const statusClass = item.statusClass;
        const statusText = item.statusText;
        const labelsHtml = item.labelsHtml;

        const card = document.createElement('details');
        card.className = 'domain-card';
        card.setAttribute('data-search-id', key.toLowerCase());
        card.setAttribute('data-search', `${key.toLowerCase()} ${hostname.toLowerCase()} ${type.toLowerCase()} ${(state.name || '').toLowerCase()}`);
        const decHash = decodeURIComponent(window.location.hash).toLowerCase();
        if (decHash === '#open:' + key.toLowerCase() || decHash === '#dns:' + key.toLowerCase() || decHash === '#dns:' + hostname.toLowerCase() || previouslyOpen.has(key.toLowerCase())) {
          card.open = true;
        }

        card.innerHTML = `
          <summary class="domain-header domain-header-dns">
            <div class="domain-header-left">
              <div class="domain-title" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span style="text-transform: lowercase;">${hostname}</span>
                <span class="badge" style="font-size: 0.72rem; padding: 2px 6px; background: var(--bg-hover); color: var(--text-muted); border: 1px solid var(--border);">${type}</span>
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">${name}</span>
              </div>
            </div>
            <div class="domain-header-right">
              <div class="domain-expiry">
                ${badgeHtml ? badgeHtml : (state.skip_ssl ? '<span class="badge" style="background: var(--bg-hover); color: var(--text-muted); font-size: 0.75rem;">ssl skipped</span>' : '')}
              </div>
              <div class="domain-status">
                <span class="status-label">
                  ${labelsHtml}
                </span>
              </div>
              <svg class="domain-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </summary>
          <div class="domain-details">
            <div class="detail-panel">
              <h3>Configuration</h3>
              <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${name}</div></div>
              <div class="detail-row"><div class="detail-label">Hostname:</div><div class="detail-value" style="text-transform: lowercase;">${hostname}</div></div>
              <div class="detail-row"><div class="detail-label">Type:</div><div class="detail-value">${type}</div></div>
              <div class="detail-row"><div class="detail-label">Expected:</div><div class="detail-value" style="text-transform: lowercase;">${expectedUl}</div></div>
            </div>
            <div class="detail-panel">
              <h3>Live Status</h3>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value" style="color: ${statusClass === 'error' ? 'var(--error)' : statusClass === 'warning' ? 'var(--warning)' : statusClass === 'ok' ? 'var(--success)' : 'var(--text-muted)'}">${statusText}</div></div>
              ${sslRow}
              <div class="detail-row"><div class="detail-label">Found:</div><div class="detail-value" style="text-transform: lowercase;">${found}</div></div>
              ${state.error ? `<div class="detail-row"><div class="detail-label">Error:</div><div class="detail-value" style="color: var(--error);">${escapeHTML(state.error)}</div></div>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      }

      if (currentView === 'dns') {
        renderStats(dnsKeys.length, healthyCount, issueCount, 0, expiringCertCount);
      }
    }

    let cachedCerts = [];
    let certCurrentPage = 1;
    const certsPerPage = 50;

    function renderCertPage(page) {
      certCurrentPage = page;
      const container = document.getElementById('certs-table-container');
      if (!container || !cachedCerts || cachedCerts.length === 0) return;

      const totalItems = cachedCerts.length;
      const totalPages = Math.ceil(totalItems / certsPerPage) || 1;
      const startIdx = (certCurrentPage - 1) * certsPerPage;
      const pageCerts = cachedCerts.slice(startIdx, startIdx + certsPerPage);

      let html = `
